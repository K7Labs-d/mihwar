<head>
<meta charset="utf-8">

<title>مستكشف القصر</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one-screen split — live 3D stage beside a details rail; on phones the rail stacks under the stage.
   Single dark look by choice: Mihwar black + champagne gold. */
:root {
  --ink: #0d1012;
  --surface: #14171a;
  --raised: #1b1f23;
  --line: #2a2f34;
  --text: #eee7d8;
  --muted: #9da2a5;
  --gold: #c9ac70;
  --gold-hi: #e2c88f;
  --on-gold: #17130b;
  --glass: rgba(13, 16, 18, 0.76);
  --sky-top: #1f2b38;
  --sky-mid: #6a7480;
  --sky-low: #d6aa78;
  --font-body: 'Tajawal', 'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif;
  --font-num: 'Cairo', 'Tajawal', 'Segoe UI', Tahoma, Arial, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--ink); color: var(--text); font-family: var(--font-body); font-size: 15px; }
[hidden] { display: none !important; }
button { font-family: inherit; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.app {
  height: 100%; box-sizing: border-box; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 12px;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; }
.mark { width: 30px; height: 30px; border-radius: 8px; background: var(--gold); display: grid; place-items: center; }
.mark::before { content: ""; width: 12px; height: 12px; border: 2px solid var(--on-gold); border-radius: 50%; }
.brand strong { display: block; font-family: var(--font-num); font-size: 17px; line-height: 1.1; }
.brand span { font-size: 12px; color: var(--muted); }
.badge { margin: 0; font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; }

.main { display: grid; grid-template-columns: minmax(0, 1fr) 390px; gap: 12px; min-height: 0; }
.stage {
  position: relative; min-height: 0; border-radius: 16px; overflow: hidden; border: 1px solid var(--line);
  background: linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-mid) 48%, var(--sky-low) 100%);
}
#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
.labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }

.pin {
  position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer; white-space: nowrap;
  font: 500 12px/1.2 var(--font-body); color: var(--text); background: var(--glass);
  border: 1px solid rgba(201, 172, 112, 0.45); border-radius: 999px; padding: 5px 10px;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); will-change: transform;
}
.pin:hover, .pin.active { background: var(--gold); color: var(--on-gold); border-color: var(--gold); }
.pin.zone { display: flex; flex-direction: column; align-items: center; padding: 0; background: none; border: 0; backdrop-filter: none; -webkit-backdrop-filter: none; }
.pin.zone b { font-weight: 500; background: var(--glass); border: 1px solid rgba(201, 172, 112, 0.45); border-radius: 999px; padding: 5px 11px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.pin.zone:hover b, .pin.zone.active b { background: var(--gold); color: var(--on-gold); border-color: var(--gold); }
.pin.zone::after { content: ""; width: 1px; height: 16px; background: var(--gold); }
.pin.room { font-size: 11px; padding: 3px 8px; }
.pin.axis {
  pointer-events: none; cursor: default; width: 22px; height: 22px; padding: 0; display: grid; place-items: center;
  font: 700 11px/1 var(--font-num); color: var(--gold-hi); border-color: rgba(201, 172, 112, 0.7);
}
.pin.dim { pointer-events: none; cursor: default; font: 700 12px/1 var(--font-num); background: var(--gold); color: var(--on-gold); border-color: var(--gold); padding: 4px 8px; }

.bar {
  position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; align-items: flex-start;
  gap: 8px; flex-wrap: wrap; pointer-events: none;
}
.bar > * { pointer-events: auto; }
.floorbar { position: absolute; top: 10px; left: 10px; display: flex; pointer-events: none; }
.floorbar > * { pointer-events: auto; }
.floors, .tools { display: flex; gap: 6px; flex-wrap: wrap; }
.floors { background: var(--glass); border: 1px solid var(--line); border-radius: 12px; padding: 4px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.floors button, .tools button {
  border: 1px solid var(--line); background: var(--glass); color: var(--text); border-radius: 9px; padding: 7px 12px;
  font-size: 13px; cursor: pointer; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.floors button { border-color: transparent; background: transparent; }
.floors button[aria-pressed="true"] { background: var(--gold); color: var(--on-gold); }
.tools button:hover, .floors button:hover { border-color: var(--gold); }

.legend {
  position: absolute; bottom: 10px; right: 10px; max-width: calc(100% - 20px); display: flex; flex-wrap: wrap; gap: 6px 12px;
  background: var(--glass); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; font-size: 12px;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); box-sizing: border-box;
}
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i, .list .dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
.hint {
  position: absolute; bottom: 12px; left: 0; right: 0; margin: 0; text-align: center; pointer-events: none; transition: opacity .4s;
}
.hint span { display: inline-block; font-size: 12px; background: var(--glass); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; }
.tip {
  position: absolute; left: 0; top: 0; pointer-events: none; z-index: 3; background: var(--surface); border: 1px solid var(--gold);
  border-radius: 10px; padding: 7px 10px; font-size: 13px; white-space: nowrap; box-shadow: 0 6px 24px rgba(0,0,0,.35);
}
.tip small { display: block; color: var(--muted); font-family: var(--font-num); font-size: 12px; margin-top: 2px; }
.fail { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; background: var(--ink); color: var(--text); line-height: 1.8; }

.panel { min-height: 0; overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.crumbs button { background: none; border: 0; color: var(--gold); padding: 2px 0; cursor: pointer; font-size: 12px; }
.crumbs .sep { opacity: .5; }
.kicker { display: flex; align-items: center; gap: 8px; margin: 14px 0 6px; font-size: 12px; color: var(--gold); }
.panel h2 { font-family: var(--font-num); font-weight: 800; font-size: 25px; line-height: 1.3; margin: 0 0 6px; text-wrap: balance; }
.lede { color: var(--muted); font-size: 14px; line-height: 1.75; margin: 0 0 4px; }
.sec { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 20px 0 8px; font-size: 13px; font-weight: 700; }
.tag { font-size: 11px; font-weight: 500; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
.tag.calc { color: var(--gold); border-color: rgba(201, 172, 112, .45); }
.metrics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; margin: 0; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.metrics div { background: var(--raised); padding: 10px 12px; min-width: 0; }
.metrics dt { font-size: 12px; color: var(--muted); margin-bottom: 3px; }
.metrics dd { margin: 0; font-family: var(--font-num); font-weight: 700; font-size: 19px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.metrics dd small { font-size: 12px; font-weight: 600; color: var(--muted); margin-inline-start: 4px; }
.metrics .wide { grid-column: 1 / -1; }
.metrics .foot { display: block; font-family: var(--font-body); font-size: 11px; font-weight: 400; color: var(--muted); margin-top: 3px; }
.list { display: grid; gap: 2px; }
.list button {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 4px 10px; width: 100%; text-align: start;
  background: transparent; border: 1px solid transparent; border-radius: 10px; padding: 8px 10px; color: var(--text); font-size: 14px; cursor: pointer;
}
.list button:hover, .list button[aria-current="true"] { background: var(--raised); border-color: var(--line); }
.list button[aria-current="true"] { border-color: rgba(201, 172, 112, .5); }
.list .val { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); }
.list .bar2 { grid-column: 2 / 4; height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
.list .bar2 i { display: block; height: 100%; background: var(--gold); }
.spec { margin: 0; border-top: 1px solid var(--line); }
.spec div { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; line-height: 1.6; }
.spec dt { color: var(--muted); }
.spec dd { margin: 0; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text); background: var(--raised); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; }
.note { font-size: 12px; color: var(--muted); line-height: 1.8; margin: 18px 0 0; padding-top: 12px; border-top: 1px dashed var(--line); }
.ltr { direction: ltr; unicode-bidi: isolate; }

@media (max-width: 860px) {
  .main { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(280px, 1fr) auto; }
  .main { grid-template-rows: minmax(320px, 1fr) auto; }
  .panel { max-height: 40dvh; padding: 14px; }
  .panel h2 { font-size: 21px; }
  .badge { display: none; }
}
@media (max-width: 600px) {
  .legend { display: none; }
  .floorbar { top: auto; bottom: 10px; left: 0; right: 0; justify-content: center; }
  .pin { font-size: 11px; padding: 4px 8px; }
  .pin.zone b { padding: 4px 8px; }
  .pin.room { font-size: 10px; padding: 3px 6px; }
}
@media (max-width: 480px) {
  .floors button, .tools button { padding: 6px 9px; font-size: 12px; }
  .legend { font-size: 11px; gap: 4px 9px; }
  .hint span { font-size: 11px; }
}
@media (prefers-reduced-motion: reduce) { .hint { transition: none; } }
</style>
</head>
<body>
<div class="app" dir="rtl" lang="ar">
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true"></span><div><strong>محور</strong><span>مستكشف المشاريع</span></div></div>
    <p class="badge">نموذج أولي · المواصفات توضيحية والمساحات محسوبة من النموذج</p>
  </header>
  <main class="main">
    <section class="stage" id="stage" aria-label="عرض ثلاثي الأبعاد للقصر">
      <canvas id="scene" aria-hidden="true"></canvas>
      <div class="labels" id="labels"></div>
      <div class="tip" id="tip" hidden></div>
      <div class="bar">
        <div class="tools">
          <button id="btn-home" type="button">الموقع كاملًا</button>
          <button id="btn-up" type="button" hidden>رجوع</button>
        </div>
      </div>
      <div class="floorbar"><div class="floors" id="floors" role="group" aria-label="الأدوار" hidden></div></div>
      <div class="legend" id="legend" hidden></div>
      <p class="hint" id="hint"><span>اسحب للتدوير · قرّب بالعجلة أو بإصبعين · اضغط على أي مبنى</span></p>
      <div class="fail" id="fail" hidden><p>تعذّر تشغيل العرض ثلاثي الأبعاد في هذا المتصفح.<br>افتح الصفحة في متصفح حديث يدعم WebGL.</p></div>
    </section>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </main>
</div>

<script>
  setTimeout(function () { if (!window.__palaceReady) { var f = document.getElementById('fail'); if (f) f.hidden = false; } }, 15000);
</script>

function sharedLen(a, b) {

  if (Math.abs(a.x1 - b.x0) < e || Math.abs(a.x0 - b.x1) < e) return Math.min(a.z1, b.z1) - Math.max(a.z0, b.z0);
  if (Math.abs(a.z1 - b.z0) < e || Math.abs(a.z0 - b.z1) < e) return Math.min(a.x1, b.x1) - Math.max(a.x0, b.x0);
  return 0;
}
function axesLabel(room) {
  const { xs, zs } = room.zone.axes, r = room.r;
  const lo = (arr, v) => { let k = 0; arr.forEach((a, i) => { if (a <= v + 0.01) k = i; }); return k; };
  const hi = (arr, v) => { const i = arr.findIndex(a => a >= v - 0.01); return i < 0 ? arr.length - 1 : i; };
  return `${AX[lo(xs, r.x0)]}–${AX[hi(xs, r.x1)]} / ${lo(zs, r.z0) + 1}–${hi(zs, r.z1) + 1}`;
}
function roomPanel(room) {
  const Z = room.zone, fl = room.floor, w = rw(room.r), d = rd(room.r), a = w * d, per = 2 * (w + d);
  const h = room.open ? null : (room.h ?? fl.h - 0.6);
  const conditioned = !room.open && !['mep', 'service'].includes(room.use);
  const tr = Math.ceil(a / 18 * 2) / 2;
  const near = fl.rooms.filter(o => o !== room && sharedLen(room.r, o.r) >= 1)
    .map(o => `<button type="button" data-go="${o.id}"><span class="dot" style="background:${USES[o.use].color}"></span><span>${esc(o.name)}</span><span class="val">جدار مشترك ${nf(sharedLen(room.r, o.r), 1)} م</span></button>`).join('');
  const cap = room.seats ? metric('سعة الجلوس', nf(room.seats), 'شخص', 'من الأثاث المرسوم') :
    room.capacity ? metric('سعة المواقف', nf(room.capacity), 'سيارة', 'من المواقف المرسومة') :
    room.beds ? metric('عدد الأسرّة', nf(room.beds), 'سرير', 'من الأثاث المرسوم') :
    room.rows ? metric('سعة المصلين', nf(room.rows * room.perRow), 'مصلٍّ', `${room.rows} صفوف × ${room.perRow}، بافتراض 0.6 م للمصلي`) :
    room.units ? metric('وحدات التكييف', nf(room.units), 'وحدة', 'من المعدات المرسومة') :
    room.stations ? metric('نقاط الوضوء', nf(room.stations), 'نقطة', 'من المقاعد المرسومة') : '';
  return `${crumbs([{ id: 'site', label: NAME }, { id: Z.floors.length > 1 ? fl.id : Z.id, label: Z.name }, ...(Z.floors.length > 1 ? [{ id: fl.id, label: fl.name }] : []), { label: room.name }])}
    <p class="kicker"><span class="chip"><span class="dot" style="background:${USES[room.use].color};width:9px;height:9px;border-radius:3px;display:inline-block"></span>${esc(USES[room.use].label)}</span></p>
    <h2>${esc(room.name)}</h2>
    <p class="lede">${esc(Z.name)} · ${esc(fl.name)} · منسوب الأرضية ${ltr('+' + nf(fl.y, 2))} م${room.note ? ` · ${esc(room.note)}` : ''}</p>
    <div class="sec">الأرقام الهندسية ${CALC}</div>
    <dl class="metrics">
      ${metric('المساحة', nf(a, 2), 'م²', 'من محور الجدار إلى محوره')}
      ${metric('المساحة الصافية', room.open ? nf(a, 2) : nf(clearArea(room), 2), 'م²', room.open ? 'فراغ مكشوف' : 'بعد خصم جدران 25 سم')}
      ${metric('الأبعاد', `<span class="ltr">${nf(w, 2)} × ${nf(d, 2)}</span>`, 'م')}
      ${metric('الارتفاع الصافي', h ? nf(h, 2) : 'مكشوف', h ? 'م' : '', room.h ? 'مزدوج الارتفاع' : '')}
      ${metric('الحجم', h ? nf(a * h, 1) : '—', h ? 'م³' : '')}
      ${metric('المحيط', nf(per, 2), 'م')}
      ${metric('مساحة الجدران', h ? nf(per * h, 1) : '—', h ? 'م²' : '', h ? 'إجمالية قبل خصم الفتحات' : '')}
      ${metric('المحاور', `<span class="ltr">${axesLabel(room)}</span>`)}
      ${conditioned ? metric('حمل تبريد تقديري', nf(tr, 1), 'طن', 'قاعدة أولية للتقدير: 1 طن لكل 18 م²', true) : ''}
      ${cap ? cap.replace('<div>', '<div class="wide">') : ''}
    </dl>
    ${near ? `<div class="sec">الفراغات المجاورة ${CALC}</div><div class="list">${near}</div>` : ''}
    <div class="sec">التشطيبات والأنظمة ${DEMO}</div>${specList(SPEC[room.use])}${NOTE}`;
}
function sitePartPanel(Z) {
  let m = '';
  if (Z.kind === 'pool') {
    const w = Z.water, avg = (Z.depth[0] + Z.depth[1]) / 2;
    m = metric('سطح الماء', nf(ra(w)), 'م²', ltr(`${nf(rw(w))} × ${nf(rd(w))}`) + ' م') + metric('حجم الماء', nf(ra(w) * avg, 1), 'م³', `بعمق متوسط ${nf(avg, 1)} م`)
      + metric('العمق', `<span class="ltr">${nf(Z.depth[0], 1)} – ${nf(Z.depth[1], 1)}</span>`, 'م') + metric('محيط الحوض', nf(2 * (rw(w) + rd(w))), 'م')
      + metric('منطقة الجلوس', nf(ra(Z.deck) - ra(w)), 'م²', 'السطح المحيط بالحوض', true);
  } else if (Z.kind === 'gardens') {
    m = metric('المسطحات الخضراء', nf(Z.area), 'م²', `${Z.patches.length} أحواض`) + metric('النخيل', nf(Z.palms), 'نخلة', 'من النموذج')
      + metric('نسبة التشجير', nf(Z.area / ra(PLOT) * 100, 1), '%', 'من مساحة الأرض') + metric('الممرات المرصوفة', nf(sum(PAVING, ra) + Math.PI * ROUND.r ** 2), 'م²', 'تقريبي مع الدوار');
  } else {
    const per = 2 * (rw(PLOT) + rd(PLOT)), net = per - (GATE[1] - GATE[0]);
    m = metric('طول السور', nf(per), 'م', 'محيط الأرض') + metric('ارتفاع السور', nf(WALL_H, 1), 'م')
      + metric('عرض البوابة', nf(GATE[1] - GATE[0]), 'م') + metric('مساحة الوجه الواحد', nf(net * WALL_H, 1), 'م²', 'بعد خصم البوابة');
  }
  return `${crumbs([{ id: 'site', label: NAME }, { label: Z.name }])}
    <p class="kicker">عنصر في الموقع</p>
    <h2>${esc(Z.name)}</h2>
    <p class="lede">${esc(Z.desc)}</p>
    <div class="sec">الأرقام ${CALC}</div><dl class="metrics">${m}</dl>
    <div class="sec">المواصفات ${DEMO}</div>${specList(Z.spec)}${NOTE}`;
}

/* ============ loop ============ */
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  size.w = w; size.h = h;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(h, 1); camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
resize();

function ease(k) { return k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; }
function tick(now) {
  requestAnimationFrame(tick);
  if (anim) {
    const k = Math.min(1, (now - anim.t0) / anim.ms), e = ease(k);
    camera.position.lerpVectors(anim.p0, anim.p1, e);
    controls.target.lerpVectors(anim.q0, anim.q1, e);
    if (k === 1) anim = null;
  }
  controls.update();
  renderer.render(scene, camera);
  updateLabels();
  if (!window.__palaceReady) window.__palaceReady = true;
}

/* first frame: wide establishing shot, then settle on the site (or the linked section) */
const start = location.hash.slice(1);
{
  const t = OVERVIEW.target, dist = 300, pol = 1.2, az = OVERVIEW.az + 0.9;
  camera.position.set(Math.sin(pol) * Math.sin(az) * dist, Math.cos(pol) * dist + 40, Math.sin(pol) * Math.cos(az) * dist).add(t);
  controls.target.copy(t); controls.update();
}
applyView(); renderPanel();
flyTo(OVERVIEW.target, OVERVIEW.radius, OVERVIEW.polar, 2200, OVERVIEW.az);
if (start && start !== 'site' && BY_ID.has(start)) setTimeout(() => go(start), reduceMotion ? 0 : 1200);
requestAnimationFrame(tick);
</script>
