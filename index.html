<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080b0e" />
    <script>
      // Set the palette before styles or React load to avoid a night/day flash.
      (() => {
        let theme = 'dark';
        try {
          if (localStorage.getItem('mihwar-theme') === 'light') theme = 'light';
        } catch {}
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content =
          theme === 'light' ? '#f5f1e8' : '#080b0e';
      })();
    </script>
    <title>منظومة محور المتكاملة</title>
    <!-- Cairo is bundled locally with its OFL license. -->
    <style>
      html, body { background: #080b0e; }
      html[data-theme="light"], html[data-theme="light"] body { background: #f5f1e8; color: #282820; }

      body {
        font-family: 'Cairo', 'Tajawal', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
    </style>
  </head>
  <body class="bg-[#05070e] text-slate-100 antialiased selection:bg-amber-500 selection:text-slate-950 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
