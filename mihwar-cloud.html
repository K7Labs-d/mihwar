            '<button class="table-action table-action-danger" type="button" data-delete-owner="' + escapeHTML(owner.id) + '">حذف</button></div></td>' +
          '</tr>';
      }).join('');
    }

    function fillOwnerCityFilter() {
      var selected = ownerCityFilter.value || 'all';
      var cities = state.owners.map(function (owner) { return owner.city; }).filter(Boolean).filter(function (city, index, list) {
        return list.indexOf(city) === index;
      }).sort();
      ownerCityFilter.innerHTML = '<option value="all">كل المدن</option>' + cities.map(function (city) {
        return '<option value="' + escapeHTML(city) + '">' + escapeHTML(city) + '</option>';
      }).join('');
      ownerCityFilter.value = cities.indexOf(selected) !== -1 ? selected : 'all';
    }

    function openOwnerEdit(owner) {
      ownerEditForm.reset();
      ownerEditForm.elements.ownerId.value = owner ? owner.id : '';
      ownerEditTitle.textContent = owner ? 'تعديل ملف المالك' : 'إضافة مالك';
      ownerEditSubmit.textContent = owner ? 'حفظ التعديلات' : 'إضافة المالك';
      if (owner) {
        ownerEditForm.elements.name.value = owner.name;
        ownerEditForm.elements.contact.value = owner.contact || '';
        ownerEditForm.elements.city.value = owner.city || '';
        ownerEditForm.elements.verification.value = owner.verification || 'pending';
      } else {
        ownerEditForm.elements.verification.value = 'pending';
      }
      if (typeof ownerEditDialog.showModal === 'function') ownerEditDialog.showModal();
      else ownerEditDialog.setAttribute('open', '');
      ownerEditForm.elements.name.focus();
    }

    function closeOwnerEdit() {
      if (typeof ownerEditDialog.close === 'function') ownerEditDialog.close();
      else ownerEditDialog.removeAttribute('open');
    }

    function toggleOwnerAccount(owner) {
      owner.accountStatus = owner.accountStatus === 'suspended' ? 'active' : 'suspended';
      addOwnerActivity(owner, owner.accountStatus === 'suspended' ? 'account_suspended' : 'account_activated', owner.accountStatus === 'suspended' ? 'إيقاف الحساب' : 'تفعيل الحساب');
      saveState(state);
      renderOwners();
      showToast(owner.accountStatus === 'suspended' ? 'تم إيقاف حساب المالك.' : 'تم تفعيل حساب المالك.');
    }

    /* ------------------------------- الحذف -------------------------------
       الحذف يرفض ترك سجلات يتيمة، فيمنع حذف مالك أو معدة مرتبطة بسجلات أخرى. */

    function deleteOwner(owner) {
      var linkedEquipment = ownerEquipment(owner.id).length;
      var linkedOrders = ownerOrders(owner.id).length;
      if (linkedEquipment || linkedOrders) {
        showToast('لا يمكن حذف المالك قبل فكّ ارتباطه بـ ' + formatNumber(linkedEquipment) + ' معدة و' + formatNumber(linkedOrders) + ' طلب.');
        return;
      }
      if (!window.confirm('هل تريد حذف ملف «' + owner.name + '» نهائيًا؟')) return;
      state.owners = state.owners.filter(function (row) { return row.id !== owner.id; });
      state.conversations = state.conversations.filter(function (row) { return row.ownerId !== owner.id; });
      saveState(state);
      renderAll();
      showToast('تم حذف ملف المالك.');
    }

    function deleteEquipment(item) {
      var linkedOrders = equipmentOrders(item.id).length;
      if (linkedOrders) {
        showToast('لا يمكن حذف المعدة لارتباطها بـ ' + formatNumber(linkedOrders) + ' طلب.');
        return;
      }
      if (!window.confirm('هل تريد حذف «' + item.name + '» من الكتالوج نهائيًا؟')) return;
      state.equipment = state.equipment.filter(function (row) { return row.id !== item.id; });
      saveState(state);
      renderAll();
      showToast('تم حذف المعدة من الكتالوج.');
    }

    function deleteOrder(order) {
      if (!window.confirm('هل تريد حذف الطلب ' + order.id + ' نهائيًا؟')) return;
      state.orders = state.orders.filter(function (row) { return row.id !== order.id; });
      state.conversations = state.conversations.filter(function (row) { return row.orderId !== order.id; });
      saveState(state);
      renderAll();
      showToast('تم حذف الطلب.');
    }

    function renderCustomers() {
      if (!state.customers.length) {
        customersBody.innerHTML = emptyRow('لا توجد بيانات عملاء حتى الآن.', 6);
        return;
      }
      customersBody.innerHTML = state.customers.map(function (customer) {
        return '<tr data-record-type="customer" data-record-id="' + escapeHTML(customer.id) + '">' +
          '<td data-label="العميل"><span class="cell-title">' + escapeHTML(customer.name) + '</span><span class="cell-sub"><bdi>' + escapeHTML(customer.id) + '</bdi></span></td>' +
          '<td data-label="وسيلة التواصل"><bdi>' + escapeHTML(customer.contact) + '</bdi></td>' +
          '<td data-label="المدينة">' + escapeHTML(customer.city) + '</td>' +
          '<td data-label="الطلبات"><bdi>' + formatNumber(customer.orders) + '</bdi></td>' +
          '<td data-label="الزيارات"><bdi>' + formatNumber(customer.visits) + '</bdi></td>' +
          '<td data-label="آخر زيارة"><bdi>' + escapeHTML(formatDate(customer.lastVisit)) + '</bdi></td>' +
          '</tr>';
      }).join('');
    }

    function renderConversations() {
      if (!state.conversations.length) {
        conversationsBody.innerHTML = emptyRow('لا توجد محادثات حتى الآن.', 5);
        return;
      }
      conversationsBody.innerHTML = state.conversations.map(function (conversation) {
        var customer = getCustomer(conversation.customerId);
        var conversationOwner = getOwner(conversation.ownerId);
        var conversationOrder = conversation.orderId ? state.orders.find(function (order) { return order.id === conversation.orderId; }) : null;
        var latest = conversation.messages[conversation.messages.length - 1];
        var unread = conversation.unread ? '<span class="unread-count" aria-label="' + formatNumber(conversation.unread) + ' رسائل غير مقروءة">' + formatNumber(conversation.unread) + '</span>' : '';
        return '<tr>' +
          '<td data-label="العميل"><span class="cell-title">' + escapeHTML(customer ? customer.name : (conversationOwner ? conversationOwner.name : 'مستلم غير محدد')) + unread + '</span><span class="cell-sub"><bdi>' + escapeHTML(conversation.id) + '</bdi></span></td>' +
          '<td data-label="المعدة">' + escapeHTML(conversation.equipment || 'رسالة إدارية') + '</td>' +
          '<td data-label="آخر رسالة"><span class="conversation-preview">' + escapeHTML(latest ? latest.text : 'لا توجد رسائل') + '</span></td>' +
          '<td data-label="آخر تحديث"><bdi>' + escapeHTML(formatDateTime(conversation.updatedAt)) + '</bdi></td>' +
          '<td data-label="الإجراء"><div class="table-actions">' + (conversationOrder ? '<a class="table-action table-action-primary" href="order.html?id=' + encodeURIComponent(conversationOrder.id) + '">عرض الطلب</a>' : '') + '<button class="table-action" type="button" data-view-conversation="' + escapeHTML(conversation.id) + '">عرض المحادثة</button></div></td>' +
          '</tr>';
      }).join('');
    }

    function hideGlobalSearchResults() {
      globalSearchResults.hidden = true;
      globalSearchInput.setAttribute('aria-expanded', 'false');
    }

    function globalSearchGroups(term) {
      function includes(value) { return String(value || '').toLowerCase().indexOf(term) !== -1; }
      return [
        {
          type: 'owner', title: 'الملاك', items: state.owners.filter(function (owner) {
            return includes(owner.id) || includes(owner.name) || includes(owner.contact) || includes(owner.city);
          }).map(function (owner) { return { id: owner.id, label: owner.name, meta: [owner.contact, owner.city].filter(Boolean).join(' · ') }; })
        },
        {
          type: 'customer', title: 'العملاء', items: state.customers.filter(function (customer) {
            return includes(customer.id) || includes(customer.name) || includes(customer.contact) || includes(customer.city);
          }).map(function (customer) { return { id: customer.id, label: customer.name, meta: [customer.contact, customer.city].filter(Boolean).join(' · ') }; })
        },
        {
          type: 'equipment', title: 'المعدات', items: state.equipment.filter(function (item) {
            var owner = getOwner(item.ownerId);
            return includes(item.id) || includes(item.name) || includes(item.category) || includes(item.city) || (owner && includes(owner.name));
          }).map(function (item) { return { id: item.id, label: item.name, meta: [item.category, item.city].filter(Boolean).join(' · ') }; })
        },
        {
          type: 'order', title: 'الطلبات', items: state.orders.filter(function (order) {
            var customer = getCustomer(order.customerId);
            return includes(order.id) || includes(order.renter) || includes(order.equipment) || (customer && includes(customer.name));
          }).map(function (order) { return { id: order.id, label: order.id, meta: [order.renter, order.equipment].filter(Boolean).join(' · ') }; })
        }
      ].filter(function (group) { return group.items.length; });
    }

    function renderGlobalSearch() {
      var term = globalSearchInput.value.trim().toLowerCase();
      if (!term) {
        hideGlobalSearchResults();
        globalSearchResults.innerHTML = '';
        return;
      }
      var groups = globalSearchGroups(term);
      globalSearchResults.hidden = false;
      globalSearchInput.setAttribute('aria-expanded', 'true');
      if (!groups.length) {
        globalSearchResults.innerHTML = '<div class="global-search-empty"><strong>لا توجد نتائج</strong><span>جرّب الاسم أو رقم التواصل أو رقم السجل.</span></div>';
        return;
      }
      globalSearchResults.innerHTML = groups.map(function (group) {
        return '<section class="global-result-group"><h3>' + group.title + '</h3>' + group.items.slice(0, 6).map(function (item) {
          return '<button type="button" data-search-result-type="' + group.type + '" data-search-result-id="' + escapeHTML(item.id) + '"><span><strong>' + escapeHTML(item.label) + '</strong><small>' + escapeHTML(item.meta || item.id) + '</small></span><bdi>' + escapeHTML(item.id) + '</bdi></button>';
        }).join('') + '</section>';
      }).join('');
    }

    function focusRecord(type, id) {
      var sectionByType = { equipment: 'equipment', customer: 'customers', order: 'orders', owner: 'owners' };
      var sectionId = sectionByType[type];
      if (!sectionId) return;
      location.hash = sectionId;
      window.setTimeout(function () {
        document.querySelectorAll('.record-highlight').forEach(function (row) { row.classList.remove('record-highlight'); });
        var row = document.querySelector('[data-record-type="' + type + '"][data-record-id="' + CSS.escape(id) + '"]');
        if (row) {
          row.classList.add('record-highlight');
          row.scrollIntoView({ behavior: 'smooth', block: 'center' });
          window.setTimeout(function () { row.classList.remove('record-highlight'); }, 2600);
        }
      }, 80);
    }

    function openSearchResult(type, id) {
      hideGlobalSearchResults();
      globalSearchInput.value = '';
      if (type === 'owner') {
        location.href = 'owner.html?id=' + encodeURIComponent(id);
        return;
      }
      if (type === 'equipment') {
        location.href = 'equipment.html?id=' + encodeURIComponent(id);
        return;
      }
      if (type === 'order') {
        location.href = 'order.html?id=' + encodeURIComponent(id);
        return;
      }
      focusRecord(type, id);
    }

    function openManualOrder() {
      manualOrderForm.reset();
      var customerOptions = state.customers.map(function (customer) {
        return '<option value="' + escapeHTML(customer.id) + '">' + escapeHTML(customer.name) + '</option>';
      }).join('');
      var equipmentOptions = state.equipment.map(function (item) {
        return '<option value="' + escapeHTML(item.id) + '">' + escapeHTML(item.name) + '</option>';
      }).join('');
      manualOrderForm.elements.customerId.innerHTML = '<option value="">اختر العميل</option>' + customerOptions;
      manualOrderForm.elements.equipmentId.innerHTML = '<option value="">اختر المعدة</option>' + equipmentOptions;
      manualOrderForm.elements.startDate.value = data.todayISO();
      var missing = [];
      if (!state.customers.length) missing.push('عميل مسجل');
      if (!state.equipment.length) missing.push('معدة مسجلة');
      manualOrderEmpty.hidden = !missing.length;
      manualOrderEmpty.textContent = missing.length ? 'يلزم وجود ' + missing.join(' و') + ' قبل إنشاء الطلب.' : '';
      manualOrderSubmit.disabled = Boolean(missing.length);
      if (typeof manualOrderDialog.showModal === 'function') manualOrderDialog.showModal();
      else manualOrderDialog.setAttribute('open', '');
    }

    function closeManualOrder() {
      if (typeof manualOrderDialog.close === 'function') manualOrderDialog.close();
      else manualOrderDialog.removeAttribute('open');
    }

    function openMessageForm() {
      messageForm.reset();
      var ownerOptions = state.owners.map(function (owner) {
        return '<option value="owner:' + escapeHTML(owner.id) + '">مالك — ' + escapeHTML(owner.name) + '</option>';
      }).join('');
      var customerOptions = state.customers.map(function (customer) {
        return '<option value="customer:' + escapeHTML(customer.id) + '">عميل — ' + escapeHTML(customer.name) + '</option>';
      }).join('');
      messageForm.elements.recipient.innerHTML = '<option value="">اختر المستلم</option>' + ownerOptions + customerOptions;
      var noRecipients = !state.owners.length && !state.customers.length;
      messageEmpty.hidden = !noRecipients;
      messageEmpty.textContent = noRecipients ? 'أضف مالكًا أو عميلًا أولًا لإرسال رسالة.' : '';
      messageSubmit.disabled = noRecipients;
      if (typeof messageDialog.showModal === 'function') messageDialog.showModal();
      else messageDialog.setAttribute('open', '');
    }

    function closeMessageForm() {
      if (typeof messageDialog.close === 'function') messageDialog.close();
      else messageDialog.removeAttribute('open');
    }

    function renderAll() {
      renderSummary();
      renderOrders();
      renderEquipment();
      fillOwnerCityFilter();
      renderOwners();
      renderCustomers();
      renderConversations();
      if (globalSearchInput.value.trim()) renderGlobalSearch();
    }

    function openDialog(item) {
      equipmentForm.reset();
      equipmentForm.elements.equipmentId.value = item ? item.id : '';
      dialogTitle.textContent = item ? 'تعديل المعدة' : 'إضافة معدة';
      if (item) {
        equipmentForm.elements.name.value = item.name;
        var owner = getOwner(item.ownerId);
        equipmentForm.elements.ownerName.value = owner ? owner.name : '';
        equipmentForm.elements.category.value = item.category;
        equipmentForm.elements.city.value = item.city;
        equipmentForm.elements.dailyRate.value = String(item.dailyRate);
        equipmentForm.elements.status.value = item.status;
      }
      if (typeof dialog.showModal === 'function') dialog.showModal();
      else dialog.setAttribute('open', '');
      equipmentForm.elements.name.focus();
    }

    function closeDialog() {
      if (typeof dialog.close === 'function') dialog.close();
      else dialog.removeAttribute('open');
    }

    function openConversation(conversation) {
      var customer = getCustomer(conversation.customerId);
      var conversationOwner = getOwner(conversation.ownerId);
      conversationTitle.textContent = customer ? customer.name : (conversationOwner ? conversationOwner.name : 'المحادثة');
      conversationMeta.textContent = (conversation.equipment || 'رسالة إدارية') + ' · ' + formatDateTime(conversation.updatedAt);
      conversationMessages.innerHTML = conversation.messages.map(function (message) {
        var isAdmin = message.from === 'admin';
        return '<article class="conversation-message ' + (isAdmin ? 'conversation-message-admin' : '') + '">' +
          '<header><strong>' + (isAdmin ? 'فريق مِحور' : 'العميل') + '</strong><bdi>' + escapeHTML(formatDateTime(message.time)) + '</bdi></header>' +
          '<p>' + escapeHTML(message.text) + '</p>' +
          '</article>';
      }).join('');

      // فتح المحادثة يُعلّمها مقروءة — وإلا بقي العدّاد معلّقاً إلى الأبد
      if (conversation.unread) {
        conversation.unread = 0;
        saveState(state);
        renderSummary();
        renderConversations();
      }

      if (typeof conversationDialog.showModal === 'function') conversationDialog.showModal();
      else conversationDialog.setAttribute('open', '');
    }

    function closeConversation() {
      if (typeof conversationDialog.close === 'function') conversationDialog.close();
      else conversationDialog.removeAttribute('open');
    }

    document.querySelectorAll('[data-add-equipment]').forEach(function (button) {
      button.addEventListener('click', function () { openDialog(null); });
    });

    document.querySelectorAll('[data-add-owner]').forEach(function (button) {
      button.addEventListener('click', function () { openOwnerEdit(null); });
    });

    document.querySelectorAll('[data-create-order]').forEach(function (button) {
      button.addEventListener('click', openManualOrder);
    });

    document.querySelectorAll('[data-send-message]').forEach(function (button) {
      button.addEventListener('click', openMessageForm);
    });

    attentionList.addEventListener('click', function (event) {
      var button = event.target.closest('[data-attention-target]');
      if (button) location.hash = button.dataset.attentionTarget;
    });

    globalSearchInput.addEventListener('input', renderGlobalSearch);
    globalSearchInput.addEventListener('keydown', function (event) {
      if (event.key === 'Escape') {
        hideGlobalSearchResults();
        globalSearchInput.blur();
      }
    });
    globalSearchResults.addEventListener('click', function (event) {
      var button = event.target.closest('[data-search-result-type]');
      if (button) openSearchResult(button.dataset.searchResultType, button.dataset.searchResultId);
    });
    document.addEventListener('click', function (event) {
      if (!globalSearchShell.contains(event.target)) hideGlobalSearchResults();
    });

    document.querySelectorAll('[data-close-dialog]').forEach(function (button) {
      button.addEventListener('click', closeDialog);
    });

    dialog.addEventListener('click', function (event) {
      if (event.target === dialog) closeDialog();
    });

    ownerSearch.addEventListener('input', renderOwners);
    ownerCityFilter.addEventListener('change', renderOwners);
    ownerVerificationFilter.addEventListener('change', renderOwners);

    ownersBody.addEventListener('click', function (event) {
      var editButton = event.target.closest('[data-edit-owner]');
      var toggleButton = event.target.closest('[data-toggle-owner]');
      var deleteButton = event.target.closest('[data-delete-owner]');
      if (editButton) {
        var ownerToEdit = getOwner(editButton.dataset.editOwner);
        if (ownerToEdit) openOwnerEdit(ownerToEdit);
      }
      if (toggleButton) {
        var ownerToToggle = getOwner(toggleButton.dataset.toggleOwner);
        if (ownerToToggle) toggleOwnerAccount(ownerToToggle);
      }
      if (deleteButton) {
        var ownerToDelete = getOwner(deleteButton.dataset.deleteOwner);
        if (ownerToDelete) deleteOwner(ownerToDelete);
      }
    });

    ordersBody.addEventListener('click', function (event) {
      var deleteButton = event.target.closest('[data-delete-order]');
      if (!deleteButton) return;
      var order = state.orders.find(function (row) { return row.id === deleteButton.dataset.deleteOrder; });
      if (order) deleteOrder(order);
    });

    document.querySelectorAll('[data-close-owner-edit]').forEach(function (button) {
      button.addEventListener('click', closeOwnerEdit);
    });

    ownerEditDialog.addEventListener('click', function (event) {
      if (event.target === ownerEditDialog) closeOwnerEdit();
    });

    ownerEditForm.addEventListener('submit', function (event) {
      event.preventDefault();
      if (!ownerEditForm.reportValidity()) return;
      var owner = getOwner(ownerEditForm.elements.ownerId.value);
      var isNewOwner = !owner;
      if (isNewOwner) {
        owner = {
          id: data.nextId('OW'),
          name: ownerEditForm.elements.name.value.trim(),
          contact: ownerEditForm.elements.contact.value.trim(),
          city: ownerEditForm.elements.city.value.trim(),
          verification: ownerEditForm.elements.verification.value,
          accountStatus: 'active',
          lastLogin: null,
          documents: [],
          ratings: [],
          activity: [],
          earnings: { transactions: [] }
        };
        state.owners.unshift(owner);
        addOwnerActivity(owner, 'owner_added', 'إضافة مالك');
      } else {
        owner.name = ownerEditForm.elements.name.value.trim();
        owner.contact = ownerEditForm.elements.contact.value.trim();
        owner.city = ownerEditForm.elements.city.value.trim();
        owner.verification = ownerEditForm.elements.verification.value;
        addOwnerActivity(owner, 'owner_updated', 'تعديل بيانات المالك');
      }
      saveState(state);
      closeOwnerEdit();
      renderAll();
      showToast(isNewOwner ? 'تمت إضافة المالك.' : 'تم حفظ بيانات المالك.');
    });

    document.querySelectorAll('[data-close-manual-order]').forEach(function (button) {
      button.addEventListener('click', closeManualOrder);
    });
    manualOrderDialog.addEventListener('click', function (event) {
      if (event.target === manualOrderDialog) closeManualOrder();
    });
    manualOrderForm.addEventListener('submit', function (event) {
      event.preventDefault();
      if (!manualOrderForm.reportValidity() || manualOrderSubmit.disabled) return;
      var customer = getCustomer(manualOrderForm.elements.customerId.value);
      var equipment = getEquipment(manualOrderForm.elements.equipmentId.value);
      if (!customer || !equipment) {
        showToast('تعذّر إنشاء الطلب لعدم اكتمال السجلات المرتبطة.');
        return;
      }

      var startDate = manualOrderForm.elements.startDate.value;
      var endDate = manualOrderForm.elements.endDate.value;
      if (endDate && endDate < startDate) {
        showToast('تاريخ النهاية يسبق تاريخ البداية.');
        return;
      }

      // القيمة إمّا يكتبها المشغّل أو تُحتسب من سعر المعدة ومدة الإيجار
      var typedValue = parseInt(manualOrderForm.elements.value.value, 10);
      var days = endDate ? data.daysBetween(startDate, endDate) : 1;
      var value = isNaN(typedValue)
        ? Math.round(equipment.dailyRate * days * (1 + data.VAT))
        : typedValue;
      var now = new Date().toISOString();

      var order = {
        id: data.nextId('MH'),
        customerId: customer.id,
        ownerId: equipment.ownerId,
        equipmentId: equipment.id,
        renter: customer.name,
        equipment: equipment.name,
        startDate: startDate,
        endDate: endDate,
        date: startDate,
        status: manualOrderForm.elements.status.value,
        value: value,
        deliveryLocation: manualOrderForm.elements.location.value.trim(),
        source: 'admin',
        createdAt: now,
        activity: [],
        timeline: [{ id: data.nextId('TL'), stage: 'new', title: 'تم إنشاء الطلب', meta: 'طلب يدوي من اللوحة', at: now }],
        notes: [],
        documents: [],
        payment: { status: 'pending', total: value, paid: 0, due: value, transactions: [] }
      };
      addRecordActivity(order, 'order_created', 'إنشاء طلب يدوي');
      state.orders.unshift(order);
      var orderOwner = getOwner(order.ownerId);
      if (orderOwner) addOwnerActivity(orderOwner, 'order_created', 'إنشاء طلب يدوي');
      saveState(state);
      closeManualOrder();
      renderAll();
      showToast('تم إنشاء الطلب ' + order.id + '.');
    });

    document.querySelectorAll('[data-close-message]').forEach(function (button) {
      button.addEventListener('click', closeMessageForm);
    });
    messageDialog.addEventListener('click', function (event) {
      if (event.target === messageDialog) closeMessageForm();
    });
    messageForm.addEventListener('submit', function (event) {
      event.preventDefault();
      if (!messageForm.reportValidity() || messageSubmit.disabled) return;
      var recipientParts = messageForm.elements.recipient.value.split(':');
      var recipientType = recipientParts[0];
      var recipientId = recipientParts.slice(1).join(':');
      var recipient = recipientType === 'owner' ? getOwner(recipientId) : getCustomer(recipientId);
      if (!recipient) {
        showToast('تعذّر العثور على المستلم.');
        return;
      }
      var conversation = state.conversations.find(function (item) {
        return !item.equipment && ((recipientType === 'owner' && item.ownerId === recipientId) || (recipientType === 'customer' && item.customerId === recipientId));
      });
      var now = new Date().toISOString();
      if (!conversation) {
        conversation = {
          id: data.nextId('CV'),
          ownerId: recipientType === 'owner' ? recipientId : null,
          customerId: recipientType === 'customer' ? recipientId : null,
          equipment: '',
          unread: 0,
          updatedAt: now,
          messages: []
        };
        state.conversations.unshift(conversation);
      }
      conversation.messages.push({ from: 'admin', text: messageForm.elements.message.value.trim(), time: now });
      conversation.updatedAt = now;
      if (recipientType === 'owner') addOwnerActivity(recipient, 'message_sent', 'إرسال رسالة إدارية');
      else addRecordActivity(recipient, 'message_sent', 'إرسال رسالة إدارية');
      saveState(state);
      closeMessageForm();
      renderAll();
      showToast('تم تسجيل الرسالة في المحادثات.');
    });

    document.querySelectorAll('[data-close-conversation]').forEach(function (button) {
      button.addEventListener('click', closeConversation);
    });

    conversationDialog.addEventListener('click', function (event) {
      if (event.target === conversationDialog) closeConversation();
    });

    conversationsBody.addEventListener('click', function (event) {
      var button = event.target.closest('[data-view-conversation]');
      if (!button) return;
      var conversation = state.conversations.find(function (item) { return item.id === button.dataset.viewConversation; });
      if (conversation) openConversation(conversation);
    });

    equipmentBody.addEventListener('click', function (event) {
      var editButton = event.target.closest('[data-edit-equipment]');
      var toggleButton = event.target.closest('[data-toggle-equipment]');
      var deleteButton = event.target.closest('[data-delete-equipment]');

      if (editButton) {
        var itemToEdit = getEquipment(editButton.dataset.editEquipment);
        if (itemToEdit) openDialog(itemToEdit);
      }

      if (deleteButton) {
        var itemToDelete = getEquipment(deleteButton.dataset.deleteEquipment);
        if (itemToDelete) deleteEquipment(itemToDelete);
      }

      if (toggleButton) {
        var item = getEquipment(toggleButton.dataset.toggleEquipment);
        if (!item) return;

        // نفس منطق صفحة المعدة: الإيقاف يحفظ الحالة السابقة ليستعيدها التفعيل،
        // فلا تقفز معدة «بانتظار المراجعة» إلى العرض بضغطة واحدة.
        var listed = data.isListed(item);
        if (listed) {
          item.previousStatus = item.status;
          item.status = 'paused';
        } else {
          item.status = item.previousStatus && item.previousStatus !== 'paused' && item.previousStatus !== 'suspended'
            ? item.previousStatus
            : 'active';
        }

        var title = listed ? 'إيقاف عرض معدة' : 'إعادة عرض معدة';
        addRecordActivity(item, 'equipment_status', title);
        var owner = getOwner(item.ownerId);
        if (owner) addOwnerActivity(owner, 'equipment_status', title);
        saveState(state);
        renderSummary();
        renderEquipment();
        renderOwners();
        showToast(listed ? 'تم إيقاف عرض المعدة.' : 'أُعيد عرض المعدة.');
      }
    });

    equipmentForm.addEventListener('submit', function (event) {
      event.preventDefault();
      if (!equipmentForm.reportValidity()) return;

      var id = equipmentForm.elements.equipmentId.value;
      var existing = getEquipment(id);
      var ownerName = equipmentForm.elements.ownerName.value.trim();
      var owner = state.owners.find(function (item) { return item.name.toLowerCase() === ownerName.toLowerCase(); });
      if (!owner) {
        owner = {
          id: data.nextId('OW'),
          name: ownerName,
          contact: '',
          city: equipmentForm.elements.city.value,
          verification: 'pending',
          accountStatus: 'active',
          lastLogin: null,
          documents: [],
          ratings: [],
          activity: [],
          earnings: { transactions: [] }
        };
        state.owners.push(owner);
      }
      var values = {
        name: equipmentForm.elements.name.value.trim(),
        ownerId: owner.id,
        category: equipmentForm.elements.category.value,
        city: equipmentForm.elements.city.value,
        dailyRate: Math.max(1, parseInt(equipmentForm.elements.dailyRate.value, 10) || 1),
        status: equipmentForm.elements.status.value
      };

      if (existing) {
        var previousRate = existing.dailyRate;
        Object.assign(existing, values);
        if (previousRate !== values.dailyRate) {
          addOwnerActivity(owner, 'price_updated', 'تعديل سعر معدة');
          addRecordActivity(existing, 'price_updated', 'تعديل سعر المعدة');
        }
        showToast('تم حفظ تعديلات المعدة.');
      } else {
        values.id = data.nextId('EQ');
        values.availability = 'available';
        values.icon = 'i-excavator';
        values.highlights = [];
        values.specs = [];
        values.terms = [];
        values.included = [];
        values.excluded = [];
        values.documents = [];
        values.maintenance = [];
        values.bookings = [];
        values.activity = [];
        values.createdAt = new Date().toISOString();
        addRecordActivity(values, 'equipment_added', 'إضافة معدة');
        state.equipment.unshift(values);
        addOwnerActivity(owner, 'equipment_added', 'إضافة معدة');
        showToast('تمت إضافة المعدة إلى القائمة.');
      }

      saveState(state);
      closeDialog();
      renderAll();
    });

    document.querySelectorAll('[data-logout]').forEach(function (button) {
      button.addEventListener('click', function () {
        clearAuth();
        location.replace('login.html');
      });
    });

    // إعادة البيانات التجريبية — مخرج آمن بعد العبث بالنموذج
    document.querySelectorAll('[data-reset-data]').forEach(function (button) {
      button.addEventListener('click', function () {
        if (!window.confirm('سيُحذف كل ما أدخلته على هذا الجهاز وتعود البيانات التجريبية. متابعة؟')) return;
        state = data.reset();
        saveState(state);
        renderAll();
        showToast('أُعيدت البيانات التجريبية.');
      });
    });

    renderAll();
    var linkedRecord = new URLSearchParams(location.search);
    var linkedType = linkedRecord.get('recordType');
    var linkedId = linkedRecord.get('recordId');
    if (linkedType && linkedId) focusRecord(linkedType, linkedId);
  }

  if (!initLogin()) initDashboard();
})();

};

MOD["admin/owner.js"] = function (location, history, localStorage, sessionStorage) {
/* مِحور — ملف المالك التشغيلي */

(function () {
  'use strict';

  var admin = window.MihwarAdmin;
  var components = window.MihwarComponents;
  if (!admin || !components || !admin.readAuth()) {
    location.replace('login.html');
    return;
  }

  var state = admin.loadState();
  var ownerId = new URLSearchParams(location.search).get('id');
  var owner = state.owners.find(function (item) { return item.id === ownerId; });
  var content = document.querySelector('[data-owner-content]');
  var notFound = document.querySelector('[data-owner-not-found]');
  var breadcrumbHost = document.querySelector('[data-owner-breadcrumb]');
  var pageHeaderHost = document.querySelector('[data-owner-page-header]');
  var tabsHost = document.querySelector('[data-owner-page-tabs]');
  var panel = document.querySelector('[data-owner-page-panel]');
  var editDialog = document.querySelector('[data-owner-page-edit-dialog]');
  var editForm = document.querySelector('[data-owner-page-edit-form]');
  var toast = document.querySelector('[data-owner-toast]');
  var toastTimer;
  var OWNER_TABS = [
    { id: 'overview', label: 'نظرة عامة' },
    { id: 'equipment', label: 'المعدات' },
    { id: 'orders', label: 'الطلبات' },
    { id: 'earnings', label: 'الأرباح' },
    { id: 'ratings', label: 'التقييمات' },
    { id: 'documents', label: 'المستندات' },
    { id: 'conversations', label: 'المحادثات' },
    { id: 'activity', label: 'سجل النشاط' }
  ];
  var validTabs = OWNER_TABS.map(function (tab) { return tab.id; });
  var currentTab = validTabs.indexOf(location.hash.slice(1)) !== -1 ? location.hash.slice(1) : 'overview';

  // المسميات كلها من طبقة البيانات المشتركة — لا نسخة ثانية تتفرّع عنها
  var EQUIPMENT_STATUS = admin.EQUIPMENT_STATUS_LABELS;
  var ORDER_STATUS = admin.STATUS_LABELS;
  var ACCOUNT_STATUS = window.MihwarData.ACCOUNT_STATUS_LABELS;

  function showToast(message) {
    window.clearTimeout(toastTimer);
    toast.textContent = message;
    toast.hidden = false;
    toastTimer = window.setTimeout(function () { toast.hidden = true; }, 2600);
  }

  var normalizePhone = admin.normalizePhone;

  function addActivity(type, title) {
    if (!Array.isArray(owner.activity)) owner.activity = [];
    owner.activity.unshift({ id: 'AC-' + String(Date.now()), type: type, title: title, at: new Date().toISOString() });
  }

  function ownerEquipment() {
    return state.equipment.filter(function (item) { return item.ownerId === owner.id; });
  }

  function ownerOrders() {
    return state.orders.filter(function (item) { return item.ownerId === owner.id; });
  }

  function ownerConversations() {
    return state.conversations.filter(function (item) { return item.ownerId === owner.id; });
  }

  function getCustomer(customerId) {
    return state.customers.find(function (customer) { return customer.id === customerId; });
  }

  function getOrderEquipment(order) {
    return state.equipment.find(function (item) {
      return item.id === order.equipmentId || (!order.equipmentId && item.name === order.equipment);
    });
  }

  function lastByDate(items, fields) {
    return items.slice().sort(function (a, b) {
      function value(item) {
        for (var index = 0; index < fields.length; index += 1) {
          if (item[fields[index]]) return new Date(item[fields[index]]).getTime() || 0;
        }
        return 0;
      }
      return value(b) - value(a);
    })[0] || null;
  }

  function emptyState(title, description, link) {
    return components.EmptyState({
      title: title,
      description: description,
      className: 'owner-page-empty',
      action: link ? { href: link.href, label: link.label, variant: 'btn-ghost' } : null
    });
  }

  function badge(label, tone) {
    return components.StatusBadge({ label: label, tone: tone });
  }

  function verificationBadge(status) {
    var safe = admin.OWNER_VERIFICATION_LABELS[status] ? status : 'pending';
    return badge(admin.OWNER_VERIFICATION_LABELS[safe], safe);
  }

  function accountBadge(status) {
    var safe = ACCOUNT_STATUS[status] ? status : 'active';
    return badge(ACCOUNT_STATUS[safe], safe === 'active' ? 'verified' : (safe === 'suspended' ? 'rejected' : 'pending'));
  }

  function equipmentBadge(status) {
    var label = EQUIPMENT_STATUS[status] || status || 'غير محددة';
    var tone = status === 'active' || status === 'displayed' ? 'verified' : (status === 'pending' || status === 'pending_review' ? 'pending' : 'rejected');
    return badge(label, tone);
  }

  function documentBadge(status) {
    var safe = admin.DOCUMENT_STATUS_LABELS[status] ? status : 'pending';
    return badge(admin.DOCUMENT_STATUS_LABELS[safe], safe);
  }

  function latestActivityDate() {
    var dates = [];
    (owner.activity || []).forEach(function (item) { if (item.at) dates.push(item.at); });
    if (owner.lastLogin) dates.push(owner.lastLogin);
    ownerConversations().forEach(function (item) { if (item.updatedAt) dates.push(item.updatedAt); });
    dates.sort(function (a, b) { return new Date(b) - new Date(a); });
    return dates[0] || null;
  }

  function timeline(items) {
    return components.Timeline({
      items: items.map(function (item) {
        return { title: item.title, meta: item.meta, timeLabel: admin.formatDateTime(item.at) };
      }),
      className: 'owner-activity-timeline',
      emptyTitle: 'لا يوجد نشاط مسجل',
      emptyDescription: 'ستظهر هنا الإجراءات الحقيقية المرتبطة بهذا المالك.'
    });
  }

  function renderBreadcrumb() {
    breadcrumbHost.innerHTML = components.Breadcrumb({
      items: [
        { label: 'الرئيسية', href: 'index.html#summary' },
        { label: 'ملاك المعدات', href: 'index.html#owners' },
        { label: owner ? owner.name : 'ملف المالك', current: true }
      ]
    });
  }

  function refreshHeader() {
    var phone = normalizePhone(owner.contact);
    document.title = owner.name + ' — مِحور';
    renderBreadcrumb();
    pageHeaderHost.innerHTML = components.PageHeader({
      avatar: owner.name.trim().charAt(0) || 'م',
      title: owner.name,
      badges: [verificationBadge(owner.verification), accountBadge(owner.accountStatus)],
      meta: [owner.contact || 'لا يوجد رقم تواصل', owner.city || 'المدينة غير محددة'],
      supportingLabel: 'آخر نشاط',
      supportingValue: admin.formatDateTime(latestActivityDate()),
      actionsAriaLabel: 'إجراءات المالك',
      actions: [
        { id: 'call', label: 'اتصال', href: phone.length >= 9 ? 'tel:+' + phone : null, disabled: phone.length < 9, title: phone.length < 9 ? 'أضف رقم التواصل أولًا' : '' },
        { id: 'whatsapp', label: 'واتساب', href: phone.length >= 9 ? 'https://wa.me/' + phone : null, target: '_blank', rel: 'noopener', disabled: phone.length < 9, title: phone.length < 9 ? 'أضف رقم التواصل أولًا' : '' },
        { id: 'edit', label: 'تعديل' },
        { id: 'verify', label: 'توثيق', hidden: owner.verification === 'verified' },
        { id: 'toggle-account', label: owner.accountStatus === 'suspended' ? 'تفعيل الحساب' : 'إيقاف الحساب', className: owner.accountStatus === 'suspended' ? 'owner-account-action is-activate' : 'owner-account-action' }
      ]
    });
  }

  function overviewTab() {
    var equipment = ownerEquipment();
    var orders = ownerOrders();
    var conversations = ownerConversations();
    var activeEquipment = equipment.filter(function (item) { return item.status === 'active' || item.status === 'displayed'; }).length;
    var openOrders = orders.filter(function (item) { return ['completed', 'closed', 'cancelled', 'rejected'].indexOf(item.status) === -1; }).length;
    var completedOrders = orders.filter(function (item) { return item.status === 'completed' || item.status === 'closed'; }).length;
    var ratings = Array.isArray(owner.ratings) ? owner.ratings.filter(function (item) { return typeof (item.value || item.score) === 'number'; }) : [];
    var ratingAverage = ratings.length ? ratings.reduce(function (sum, item) { return sum + Number(item.value || item.score); }, 0) / ratings.length : null;
    var documents = Array.isArray(owner.documents) ? owner.documents : [];
    var incompleteDocuments = documents.length ? documents.filter(function (item) { return item.status !== 'verified'; }).length : null;
    var lastOrder = lastByDate(orders, ['createdAt', 'date']);
    var lastConversation = lastByDate(conversations, ['updatedAt']);
    var linkedCustomers = orders.map(function (order) { return getCustomer(order.customerId); }).filter(Boolean).filter(function (customer, index, list) {
      return list.findIndex(function (item) { return item.id === customer.id; }) === index;
    });

    return '<div class="owner-metric-grid owner-operational-metrics">' +
      '<article><span>المعدات النشطة</span><strong>' + admin.formatNumber(activeEquipment) + '</strong></article>' +
      '<article><span>الطلبات المفتوحة</span><strong>' + admin.formatNumber(openOrders) + '</strong></article>' +
      '<article><span>الطلبات المكتملة</span><strong>' + admin.formatNumber(completedOrders) + '</strong></article>' +
      '<article><span>متوسط التقييم</span><strong>' + (ratingAverage === null ? '—' : admin.escapeHTML(ratingAverage.toFixed(1))) + '</strong><small>' + (ratingAverage === null ? 'لا توجد تقييمات' : window.MihwarData.countLabel(ratings.length, { one: 'تقييم واحد', two: 'تقييمان', few: 'تقييمات', many: 'تقييماً' })) + '</small></article>' +
      '<article><span>المستندات الناقصة</span><strong>' + (incompleteDocuments === null ? '—' : admin.formatNumber(incompleteDocuments)) + '</strong><small>' + (incompleteDocuments === null ? 'لا توجد مستندات' : 'بحسب المستندات المسجلة') + '</small></article>' +
      '<article><span>آخر طلب</span><strong class="metric-date">' + (lastOrder ? admin.escapeHTML(lastOrder.id) : '—') + '</strong><small>' + (lastOrder ? admin.escapeHTML(admin.formatDate(lastOrder.date || lastOrder.createdAt)) : 'لا توجد طلبات') + '</small></article>' +
      '<article><span>آخر تواصل</span><strong class="metric-date"><bdi>' + admin.escapeHTML(lastConversation ? admin.formatDateTime(lastConversation.updatedAt) : '—') + '</bdi></strong><small>' + (lastConversation ? 'محادثة مسجلة' : 'لا توجد محادثات') + '</small></article>' +
      '</div>' +
      '<section class="owner-relationships"><div class="panel-heading"><div><span class="eyebrow">الروابط التشغيلية</span><h2>السجلات المرتبطة</h2></div></div><div class="relationship-grid">' +

      '<a href="index.html#customers"><span>العملاء المرتبطون</span><strong>' + admin.formatNumber(linkedCustomers.length) + '</strong><small>فتح قائمة العملاء</small></a>' +
      '<a href="index.html#conversations"><span>المحادثات</span><strong>' + admin.formatNumber(conversations.length) + '</strong><small>فتح سجل المحادثات</small></a>' +
      '</div></section>';
  }

  function equipmentTab() {
    var equipment = ownerEquipment();
    if (!equipment.length) return emptyState('لا توجد معدات', 'لم تُربط أي معدة بهذا المالك حتى الآن.', { href: 'index.html#equipment', label: 'فتح قائمة المعدات' });
    return '<div class="owner-section-heading"><div><h2>معدات المالك</h2><p>المعدات المرتبطة بهذا الملف.</p></div><a class="btn btn-ghost" href="index.html#equipment">قائمة المعدات</a></div>' +
      '<div class="admin-table-wrap"><table class="admin-table profile-table"><thead><tr><th>المعدة</th><th>الفئة</th><th>المدينة</th><th>السعر اليومي</th><th>الحالة</th><th>الانتقال</th></tr></thead><tbody>' + equipment.map(function (item) {
        return '<tr><td data-label="المعدة"><a class="record-link cell-title" href="equipment.html?id=' + encodeURIComponent(item.id) + '">' + admin.escapeHTML(item.name) + '</a><span class="cell-sub"><bdi>' + admin.escapeHTML(item.id) + '</bdi></span></td><td data-label="الفئة">' + admin.escapeHTML(item.category || '—') + '</td><td data-label="المدينة">' + admin.escapeHTML(item.city || '—') + '</td><td data-label="السعر اليومي"><bdi>' + (typeof item.dailyRate === 'number' ? admin.escapeHTML(admin.formatRiyal(item.dailyRate)) : '—') + '</bdi></td><td data-label="الحالة">' + equipmentBadge(item.status) + '</td><td data-label="الانتقال"><a class="table-action table-action-primary" href="equipment.html?id=' + encodeURIComponent(item.id) + '">عرض الملف</a></td></tr>';
      }).join('') + '</tbody></table></div>';
  }

  function ordersTab() {
    var orders = ownerOrders();
    if (!orders.length) return emptyState('لا توجد طلبات', 'لا توجد طلبات مرتبطة بهذا المالك حتى الآن.', { href: 'index.html#orders', label: 'فتح قائمة الطلبات' });
    return '<div class="owner-section-heading"><div><h2>طلبات المالك</h2><p>الطلبات المرتبطة بمعداته.</p></div><a class="btn btn-ghost" href="index.html#orders">قائمة الطلبات</a></div>' +
      '<div class="admin-table-wrap"><table class="admin-table profile-table"><thead><tr><th>رقم الطلب</th><th>العميل</th><th>المعدة</th><th>التاريخ</th><th>الحالة</th><th>القيمة</th></tr></thead><tbody>' + orders.map(function (order) {
        var customer = getCustomer(order.customerId);
        var linkedEquipment = getOrderEquipment(order);
        var customerCell = customer
          ? '<a class="record-link" href="index.html?recordType=customer&amp;recordId=' + encodeURIComponent(customer.id) + '#customers">' + admin.escapeHTML(order.renter || customer.name) + '</a>'
          : admin.escapeHTML(order.renter || '—');
        var orderTone = ['completed', 'closed', 'returned'].indexOf(order.status) !== -1 ? 'verified' : (order.status === 'cancelled' || order.status === 'rejected' ? 'rejected' : 'pending');
        return '<tr><td data-label="رقم الطلب"><a class="record-link" href="order.html?id=' + encodeURIComponent(order.id) + '"><bdi>' + admin.escapeHTML(order.id) + '</bdi></a></td><td data-label="العميل">' + customerCell + '</td><td data-label="المعدة">' + (linkedEquipment ? '<a class="record-link" href="equipment.html?id=' + encodeURIComponent(linkedEquipment.id) + '">' + admin.escapeHTML(linkedEquipment.name) + '</a>' : admin.escapeHTML(order.equipment || '—')) + '</td><td data-label="التاريخ"><bdi>' + admin.escapeHTML(admin.formatDate(order.date || order.createdAt)) + '</bdi></td><td data-label="الحالة">' + badge(ORDER_STATUS[order.status] || order.status || 'غير محددة', orderTone) + '</td><td data-label="القيمة"><bdi>' + (typeof order.value === 'number' ? admin.escapeHTML(admin.formatRiyal(order.value)) : '—') + '</bdi></td></tr>';
      }).join('') + '</tbody></table></div>';
  }

  function earningsTab() {
    var earnings = owner.earnings || {};
    var transactions = Array.isArray(earnings.transactions) ? earnings.transactions : [];
    var total = typeof earnings.total === 'number' ? earnings.total : null;
    var due = typeof earnings.due === 'number' ? earnings.due : null;
    var transferred = typeof earnings.transferred === 'number' ? earnings.transferred : null;
    var metrics = '<div class="owner-metric-grid owner-finance-grid"><article><span>إجمالي الإيرادات</span><strong>' + (total === null ? '—' : admin.escapeHTML(admin.formatRiyal(total))) + '</strong></article><article><span>المستحق</span><strong>' + (due === null ? '—' : admin.escapeHTML(admin.formatRiyal(due))) + '</strong></article><article><span>المحوّل</span><strong>' + (transferred === null ? '—' : admin.escapeHTML(admin.formatRiyal(transferred))) + '</strong></article></div>';
    if (!transactions.length) return metrics + emptyState('لا توجد عمليات مالية', 'ستظهر الإيرادات والمستحقات والتحويلات عند تسجيل عمليات حقيقية.');
    return metrics + '<div class="admin-table-wrap"><table class="admin-table profile-table"><thead><tr><th>العملية</th><th>التاريخ</th><th>النوع</th><th>الحالة</th><th>القيمة</th></tr></thead><tbody>' + transactions.map(function (item) {
      return '<tr><td data-label="العملية"><bdi>' + admin.escapeHTML(item.id || '—') + '</bdi></td><td data-label="التاريخ"><bdi>' + admin.escapeHTML(admin.formatDate(item.date)) + '</bdi></td><td data-label="النوع">' + admin.escapeHTML(item.label || item.type || '—') + '</td><td data-label="الحالة">' + admin.escapeHTML(admin.recordStatusLabel(item.status)) + '</td><td data-label="القيمة"><bdi>' + (typeof item.amount === 'number' ? admin.escapeHTML(admin.formatRiyal(item.amount)) : '—') + '</bdi></td></tr>';
    }).join('') + '</tbody></table></div>';
  }

  function ratingsTab() {
    var ratings = Array.isArray(owner.ratings) ? owner.ratings : [];
    if (!ratings.length) return emptyState('لا توجد تقييمات', 'لم يستلم هذا المالك أي تقييم بعد.');
    return '<div class="rating-list">' + ratings.map(function (item) {
      var score = item.value || item.score;
      return '<article class="rating-card"><header><strong>' + admin.escapeHTML(item.author || item.customer || 'تقييم مسجل') + '</strong><span>' + (typeof score === 'number' ? admin.escapeHTML(String(score)) + ' / 5' : '—') + '</span></header><p>' + admin.escapeHTML(item.comment || 'لا يوجد تعليق.') + '</p><small><bdi>' + admin.escapeHTML(admin.formatDate(item.date)) + '</bdi></small></article>';
    }).join('') + '</div>';
  }

  function documentsTab() {
    var documents = Array.isArray(owner.documents) ? owner.documents : [];
    if (!documents.length) return emptyState('لا توجد مستندات', 'لم تُرفع الهوية أو السجل التجاري أو مستندات المعدات بعد.');
    return '<div class="document-list">' + documents.map(function (item) {
      return '<article class="document-row"><div><strong>' + admin.escapeHTML(item.name || item.type || 'مستند') + '</strong><span>' + admin.escapeHTML(item.note || 'مستند مرتبط بملف المالك') + '</span></div>' + documentBadge(item.status) + '</article>';
    }).join('') + '</div>';
  }

  function conversationsTab() {
    var conversations = ownerConversations();
    if (!conversations.length) return emptyState('لا توجد محادثات', 'لا توجد محادثات مرتبطة بهذا المالك حتى الآن.', { href: 'index.html#conversations', label: 'فتح سجل المحادثات' });
    return '<div class="document-list">' + conversations.map(function (conversation) {
      var customer = getCustomer(conversation.customerId);
      var latest = conversation.messages && conversation.messages.length ? conversation.messages[conversation.messages.length - 1] : null;
      return '<article class="document-row"><div><strong>' + admin.escapeHTML(customer ? customer.name : (conversation.equipment || 'محادثة إدارية')) + '</strong><span>' + admin.escapeHTML(latest ? latest.text : 'لا توجد رسائل') + '</span><small><bdi>' + admin.escapeHTML(admin.formatDateTime(conversation.updatedAt)) + '</bdi></small></div><a class="table-action" href="index.html#conversations">فتح السجل</a></article>';
    }).join('') + '</div>';
  }

  function activityTab() {
    var activity = [];
    (owner.activity || []).forEach(function (item) { if (item.at) activity.push({ title: item.title, at: item.at, meta: 'ملف المالك' }); });
    if (owner.lastLogin) activity.push({ title: 'تسجيل دخول', at: owner.lastLogin, meta: owner.name });
    ownerEquipment().forEach(function (equipment) {
      (equipment.activity || []).forEach(function (item) { if (item.at) activity.push({ title: item.title, at: item.at, meta: equipment.name }); });
    });
    ownerOrders().forEach(function (order) {
      (order.activity || []).forEach(function (item) { if (item.at) activity.push({ title: item.title, at: item.at, meta: order.id }); });
    });
    activity.sort(function (a, b) { return new Date(b.at) - new Date(a.at); });
    return timeline(activity);
  }

  var tabRenderers = {
    overview: overviewTab,
    equipment: equipmentTab,
    orders: ordersTab,
    earnings: earningsTab,
    ratings: ratingsTab,
    documents: documentsTab,
    conversations: conversationsTab,
    activity: activityTab
  };

  function renderTab() {
    tabsHost.innerHTML = components.EntityTabs({
      tabs: OWNER_TABS,
      active: currentTab,
      panelId: 'owner-tab-panel',
      ariaLabel: 'أقسام ملف المالك',
      className: 'owner-page-tabs'
    });
    panel.innerHTML = tabRenderers[currentTab]();
  }

  function renderPage() {
    refreshHeader();
    renderTab();
  }

  function openEdit() {
    editForm.elements.name.value = owner.name;
    editForm.elements.contact.value = owner.contact || '';
    editForm.elements.city.value = owner.city || '';
    editForm.elements.verification.value = owner.verification || 'pending';
    if (typeof editDialog.showModal === 'function') editDialog.showModal();
    else editDialog.setAttribute('open', '');
    editForm.elements.name.focus();
  }

  function closeEdit() {
    if (typeof editDialog.close === 'function') editDialog.close();
    else editDialog.removeAttribute('open');
  }

  document.querySelector('[data-owner-logout]').addEventListener('click', function () {
    admin.clearAuth();
    location.replace('login.html');
  });

  renderBreadcrumb();

  if (!owner) {
    notFound.hidden = false;
    return;
  }

  content.hidden = false;
  renderPage();

  components.bindEntityTabs(tabsHost, function (tabId) {
    if (validTabs.indexOf(tabId) === -1) return;
    currentTab = tabId;
    history.replaceState(null, '', location.pathname + location.search + '#' + currentTab);
    renderTab();
  });

  pageHeaderHost.addEventListener('click', function (event) {
    var action = event.target.closest('[data-quick-action]');
    if (!action || action.getAttribute('aria-disabled') === 'true') return;
    if (action.dataset.quickAction === 'edit') openEdit();
    if (action.dataset.quickAction === 'verify') {
      owner.verification = 'verified';
      addActivity('owner_verified', 'توثيق المالك');
      admin.saveState(state);
      renderPage();
      showToast('تم توثيق المالك.');
    }
    if (action.dataset.quickAction === 'toggle-account') {
      var suspending = owner.accountStatus !== 'suspended';
      var confirmation = suspending ? 'هل تريد إيقاف حساب هذا المالك؟' : 'هل تريد تفعيل حساب هذا المالك؟';
      if (!window.confirm(confirmation)) return;
      owner.accountStatus = suspending ? 'suspended' : 'active';
      addActivity(suspending ? 'account_suspended' : 'account_activated', suspending ? 'إيقاف الحساب' : 'تفعيل الحساب');
      admin.saveState(state);
      renderPage();
      showToast(suspending ? 'تم إيقاف حساب المالك.' : 'تم تفعيل حساب المالك.');
    }
  });

  document.querySelectorAll('[data-close-owner-page-edit]').forEach(function (button) { button.addEventListener('click', closeEdit); });
  editDialog.addEventListener('click', function (event) { if (event.target === editDialog) closeEdit(); });
  editForm.addEventListener('submit', function (event) {
    event.preventDefault();
    if (!editForm.reportValidity()) return;
    owner.name = editForm.elements.name.value.trim();
    owner.contact = editForm.elements.contact.value.trim();
    owner.city = editForm.elements.city.value.trim();
    owner.verification = editForm.elements.verification.value;
    addActivity('owner_updated', 'تعديل بيانات المالك');
    admin.saveState(state);
    closeEdit();
    renderPage();
    showToast('تم حفظ بيانات المالك.');
  });

})();

};

MOD["admin/equipment.js"] = function (location, history, localStorage, sessionStorage) {
/* مِحور — ملف المعدة التشغيلي */

(function () {
  'use strict';

  var admin = window.MihwarAdmin;
  var components = window.MihwarComponents;
  var data = window.MihwarData;
  if (!admin || !components || !admin.readAuth()) {
    location.replace('login.html');
    return;
  }

  var state = admin.loadState();
  var equipmentId = new URLSearchParams(location.search).get('id');
  var equipment = state.equipment.find(function (item) { return item.id === equipmentId; });
  var owner = equipment ? state.owners.find(function (item) { return item.id === equipment.ownerId; }) : null;
  var content = document.querySelector('[data-equipment-content]');
  var notFound = document.querySelector('[data-equipment-not-found]');
  var breadcrumbHost = document.querySelector('[data-equipment-breadcrumb]');
  var pageHeaderHost = document.querySelector('[data-equipment-page-header]');
  var tabsHost = document.querySelector('[data-equipment-page-tabs]');
  var panel = document.querySelector('[data-equipment-page-panel]');
  var editDialog = document.querySelector('[data-equipment-page-edit-dialog]');
  var editForm = document.querySelector('[data-equipment-page-edit-form]');
  var statusDialog = document.querySelector('[data-equipment-status-dialog]');
  var statusForm = document.querySelector('[data-equipment-status-form]');
  var toast = document.querySelector('[data-equipment-toast]');
  var toastTimer;

  var EQUIPMENT_TABS = [
    { id: 'overview', label: 'نظرة عامة' },
    { id: 'orders', label: 'الطلبات' },
    { id: 'bookings', label: 'الحجوزات' },
    { id: 'revenue', label: 'الإيرادات' },
    { id: 'documents', label: 'المستندات' },
    { id: 'maintenance', label: 'الصيانة' },
    { id: 'notes', label: 'الملاحظات' },
    { id: 'activity', label: 'سجل النشاط' }
  ];
  var validTabs = EQUIPMENT_TABS.map(function (tab) { return tab.id; });
  var currentTab = validTabs.indexOf(location.hash.slice(1)) !== -1 ? location.hash.slice(1) : 'overview';

  // المسميات كلها من طبقة البيانات المشتركة — لا نسخة ثانية تتفرّع عنها
  var EQUIPMENT_STATUS = admin.EQUIPMENT_STATUS_LABELS;
  var ORDER_STATUS = admin.STATUS_LABELS;

  function showToast(message) {
    window.clearTimeout(toastTimer);
    toast.textContent = message;
    toast.hidden = false;
    toastTimer = window.setTimeout(function () { toast.hidden = true; }, 2600);
  }

  function addActivity(type, title) {
    if (!Array.isArray(equipment.activity)) equipment.activity = [];
    equipment.activity.unshift({ id: 'AC-' + String(Date.now()), type: type, title: title, at: new Date().toISOString() });
    equipment.updatedAt = new Date().toISOString();
  }

  function relatedOrders() {
    return state.orders.filter(function (order) {
      return order.equipmentId === equipment.id || (!order.equipmentId && order.equipment === equipment.name);
    });
  }

  function getCustomer(customerId) {
    return state.customers.find(function (customer) { return customer.id === customerId; });
  }

  function dateValue(item, fields) {
    for (var index = 0; index < fields.length; index += 1) {
      if (item && item[fields[index]]) return new Date(item[fields[index]]).getTime() || 0;
    }
    return 0;
  }

  function latest(items, fields) {
    return items.slice().sort(function (a, b) { return dateValue(b, fields) - dateValue(a, fields); })[0] || null;
  }

  function orderHref(order) {
    return 'order.html?id=' + encodeURIComponent(order.id);
  }

  function customerHref(customer) {
    return customer ? 'index.html?recordType=customer&recordId=' + encodeURIComponent(customer.id) + '#customers' : 'index.html#customers';
  }

  function emptyState(title, description, action) {
    return components.EmptyState({
      title: title,
      description: description,
      className: 'owner-page-empty',
      action: action || null
    });
  }

  function badge(label, tone) {
    return components.StatusBadge({ label: label, tone: tone });
  }

  function equipmentBadge(status) {
    var label = EQUIPMENT_STATUS[status] || status || 'غير محددة';
    var tone = status === 'active' || status === 'displayed' ? 'verified' : (status === 'pending' || status === 'pending_review' ? 'pending' : 'rejected');
    return badge(label, tone);
  }

  function orderBadge(status) {
    var tone = ['completed', 'closed', 'returned'].indexOf(status) !== -1 ? 'verified' : (status === 'cancelled' || status === 'rejected' ? 'rejected' : 'pending');
    return badge(ORDER_STATUS[status] || status || 'غير محددة', tone);
  }

  function documentBadge(document) {
    var expired = document.expiresAt && new Date(document.expiresAt).getTime() < Date.now();
    if (expired) return badge('منتهي', 'rejected');
    var label = admin.DOCUMENT_STATUS_LABELS[document.status] || document.status || 'غير محددة';
    var tone = document.status === 'verified' ? 'verified' : (document.status === 'rejected' ? 'rejected' : 'pending');
    return badge(label, tone);
  }

  function activeOrder() {
    var activeStatuses = ['new', 'awaiting_owner', 'contacting', 'confirmed', 'in_progress'];
    return latest(relatedOrders().filter(function (order) { return activeStatuses.indexOf(order.status) !== -1; }), ['updatedAt', 'createdAt', 'date']);
  }

  function activityItems() {
    var items = [];
    (equipment.activity || []).forEach(function (item) {
      if (item.at) items.push({ title: item.title || 'نشاط على المعدة', meta: item.meta || '', at: item.at });
    });
    relatedOrders().forEach(function (order) {
      (order.activity || []).forEach(function (item) {
        if (item.at) items.push({ title: item.title || 'تحديث طلب', meta: 'الطلب ' + order.id, at: item.at });
      });
    });
    return items.sort(function (a, b) { return new Date(b.at) - new Date(a.at); });
  }

  function latestActivityDate() {
    var entries = activityItems();
    var dates = entries.map(function (item) { return item.at; });
    ['updatedAt', 'createdAt'].forEach(function (field) { if (equipment[field]) dates.push(equipment[field]); });
    dates.sort(function (a, b) { return new Date(b) - new Date(a); });
    return dates[0] || null;
  }

  function documentIssues() {
    var documents = Array.isArray(equipment.documents) ? equipment.documents : [];
    var issues = [];
    documents.forEach(function (document) {
      if (document.expiresAt && new Date(document.expiresAt).getTime() < Date.now()) {
        issues.push({ label: document.name || document.type || 'مستند', reason: 'منتهي' });
      } else if (document.status === 'rejected') {
        issues.push({ label: document.name || document.type || 'مستند', reason: 'مرفوض' });
      }
    });
    if (Array.isArray(equipment.requiredDocuments)) {
      equipment.requiredDocuments.forEach(function (required) {
        var found = documents.some(function (document) { return document.type === required || document.name === required; });
        if (!found) issues.push({ label: required, reason: 'غير مرفوع' });
      });
    }
    return issues;
  }

  function renderBreadcrumb() {
    breadcrumbHost.innerHTML = components.Breadcrumb({
      items: [
        { label: 'الرئيسية', href: 'index.html#summary' },
        { label: 'المعدات', href: 'index.html#equipment' },
        { label: equipment ? equipment.name : 'ملف المعدة', current: true }
      ]
    });
  }

  function refreshHeader() {
    owner = state.owners.find(function (item) { return item.id === equipment.ownerId; }) || null;
    var previewUrl = data.isListed(equipment) ? '../' + data.detailPath(equipment) : '';
    var imageUrl = typeof (equipment.imageUrl || equipment.image || equipment.photoUrl) === 'string' ? (equipment.imageUrl || equipment.image || equipment.photoUrl) : '';
    document.title = equipment.name + ' — مِحور';
    renderBreadcrumb();
    pageHeaderHost.innerHTML = components.PageHeader({
      imageUrl: imageUrl,
      imageAlt: 'صورة ' + equipment.name,
      avatar: '🚜',
      avatarClassName: 'equipment-page-media',
      title: equipment.name,
      badges: [equipmentBadge(equipment.status)],
      meta: [
        equipment.category || 'الفئة غير محددة',
        owner ? { label: owner.name, href: 'owner.html?id=' + encodeURIComponent(owner.id) } : 'لا يوجد مالك مرتبط',
        equipment.city || 'المدينة غير محددة',
        typeof equipment.dailyRate === 'number' ? admin.formatRiyal(equipment.dailyRate) + ' يوميًا' : 'السعر اليومي غير مسجل'
      ],
      supportingLabel: 'آخر نشاط',
      supportingValue: admin.formatDateTime(latestActivityDate()),
      actionsAriaLabel: 'إجراءات المعدة',
      actions: [
        { id: 'edit', label: 'تعديل' },
        { id: 'preview', label: 'معاينة في الموقع', href: previewUrl || null, target: previewUrl ? '_blank' : '', rel: previewUrl ? 'noopener' : '', disabled: !previewUrl, title: !previewUrl ? 'المعدة غير معروضة على الموقع حاليًا' : '' },
        { id: 'change-status', label: 'تغيير الحالة' },
        { id: 'toggle', label: equipment.status === 'paused' || equipment.status === 'suspended' ? 'تفعيل' : 'إيقاف', className: equipment.status === 'paused' || equipment.status === 'suspended' ? 'owner-account-action is-activate' : 'owner-account-action' },
        { id: 'owner', label: 'فتح ملف المالك', href: owner ? 'owner.html?id=' + encodeURIComponent(owner.id) : null, disabled: !owner, title: !owner ? 'لا يوجد مالك مرتبط' : '' }
      ]
    });
  }

  function overviewTab() {
    var orders = relatedOrders();
    var currentOrder = activeOrder();
    var lastOrder = latest(orders, ['updatedAt', 'createdAt', 'date']);
    var customer = lastOrder ? getCustomer(lastOrder.customerId) : null;
    var renterName = lastOrder ? (lastOrder.renter || (customer ? customer.name : '')) : '';
    var available = (equipment.status === 'active' || equipment.status === 'displayed') && !currentOrder;
    var issues = documentIssues();
    var note = equipment.operationalNote || (typeof equipment.notes === 'string' ? equipment.notes : '');

    return '<div class="owner-info-grid equipment-overview-grid">' +
      '<div><span>الحالة الحالية</span><strong>' + equipmentBadge(equipment.status) + '</strong></div>' +
      '<div><span>متاحة الآن</span><strong>' + (available ? 'نعم' : 'لا') + '</strong></div>' +
      '<div><span>الطلب النشط</span><strong>' + (currentOrder ? '<a class="record-link" href="' + orderHref(currentOrder) + '"><bdi>' + admin.escapeHTML(currentOrder.id) + '</bdi></a>' : 'لا يوجد') + '</strong></div>' +
      '<div><span>عدد الطلبات</span><strong>' + admin.formatNumber(orders.length) + '</strong></div>' +
      '<div><span>آخر مستأجر</span><strong>' + (renterName ? '<a class="record-link" href="' + customerHref(customer) + '">' + admin.escapeHTML(renterName) + '</a>' : 'لا يوجد') + '</strong></div>' +
      '<div><span>آخر تعديل</span><strong><bdi>' + admin.escapeHTML(admin.formatDateTime(equipment.updatedAt || equipment.createdAt)) + '</bdi></strong></div>' +
      '</div>' +
      '<div class="equipment-overview-sections">' +
        '<section><div class="owner-section-heading"><div><h2>المستندات الناقصة أو المنتهية</h2><p>بحسب المستندات والمتطلبات المسجلة لهذه المعدة.</p></div><button class="table-action" type="button" data-open-tab="documents">فتح المستندات</button></div>' +
          (issues.length ? '<div class="document-list">' + issues.map(function (issue) { return '<article class="document-row"><div><strong>' + admin.escapeHTML(issue.label) + '</strong><span>' + admin.escapeHTML(issue.reason) + '</span></div>' + badge(issue.reason, 'rejected') + '</article>'; }).join('') + '</div>' : emptyState('لا توجد مشكلات مستندية مسجلة', 'لم تُسجل مستندات ناقصة أو منتهية في بيانات هذه المعدة.')) +
        '</section>' +
        '<section><div class="owner-section-heading"><div><h2>ملاحظة تشغيلية</h2><p>الملاحظة المختصرة المسجلة على المعدة.</p></div><button class="table-action" type="button" data-open-tab="notes">فتح الملاحظات</button></div>' +
          (note ? '<div class="equipment-operational-note"><p>' + admin.escapeHTML(note) + '</p></div>' : emptyState('لا توجد ملاحظة تشغيلية', 'يمكن إضافة ملاحظة حقيقية من إجراء تعديل.')) +
        '</section>' +
      '</div>';
  }

  function ordersTab() {
    var orders = relatedOrders();
    if (!orders.length) return emptyState('لا توجد طلبات', 'لا توجد طلبات مرتبطة بهذه المعدة حتى الآن.', { href: 'index.html#orders', label: 'فتح قائمة الطلبات', variant: 'btn-ghost' });
    return '<div class="owner-section-heading"><div><h2>طلبات المعدة</h2><p>الطلبات المرتبطة بسجل هذه المعدة.</p></div><a class="btn btn-ghost" href="index.html#orders">قائمة الطلبات</a></div>' +
      '<div class="admin-table-wrap"><table class="admin-table profile-table"><thead><tr><th>رقم الطلب</th><th>العميل</th><th>التاريخ</th><th>الحالة</th><th>القيمة</th></tr></thead><tbody>' + orders.map(function (order) {
        var customer = getCustomer(order.customerId);
        return '<tr><td data-label="رقم الطلب"><a class="record-link" href="' + orderHref(order) + '"><bdi>' + admin.escapeHTML(order.id) + '</bdi></a></td><td data-label="العميل"><a class="record-link" href="' + customerHref(customer) + '">' + admin.escapeHTML(order.renter || (customer ? customer.name : '—')) + '</a></td><td data-label="التاريخ"><bdi>' + admin.escapeHTML(admin.formatDate(order.date || order.createdAt)) + '</bdi></td><td data-label="الحالة">' + orderBadge(order.status) + '</td><td data-label="القيمة"><bdi>' + (typeof order.value === 'number' ? admin.escapeHTML(admin.formatRiyal(order.value)) : '—') + '</bdi></td></tr>';
      }).join('') + '</tbody></table></div>';
  }

  function bookingsTab() {
    var bookings = Array.isArray(equipment.bookings) ? equipment.bookings : [];
    if (!bookings.length) return emptyState('لا توجد حجوزات', 'لا توجد حجوزات مسجلة لهذه المعدة.');

  function revenueTab() {

    var completedValues = relatedOrders().filter(function (order) { return order.status === 'completed' && typeof order.value === 'number'; });
    var total = typeof earnings.total === 'number' ? earnings.total : (completedValues.length ? completedValues.reduce(function (sum, order) { return sum + order.value; }, 0) : null);
    var summary = total === null ? '' : '<div class="owner-metric-grid owner-finance-grid"><article><span>إجمالي الإيرادات المسجلة</span><strong>' + admin.escapeHTML(admin.formatRiyal(total)) + '</strong><small>' + (typeof earnings.total === 'number' ? 'بحسب سجل الإيرادات' : 'محسوب من الطلبات المكتملة ذات القيمة المسجلة') + '</small></article></div>';
    if (!transactions.length) return summary + emptyState('لا توجد عمليات إيراد', 'ستظهر العمليات المالية عند تسجيل بيانات حقيقية لهذه المعدة.');
    return summary + '<div class="admin-table-wrap"><table class="admin-table profile-table"><thead><tr><th>العملية</th><th>التاريخ</th><th>البيان</th><th>الحالة</th><th>القيمة</th></tr></thead><tbody>' + transactions.map(function (item) {

    }).join('') + '</tbody></table></div>';
  }

  function documentsTab() {
    var documents = Array.isArray(equipment.documents) ? equipment.documents : [];
    if (!documents.length) return emptyState('لا توجد مستندات', 'لم تُرفع مستندات لهذه المعدة بعد.');
    return '<div class="document-list">' + documents.map(function (document) {
      var expiry = document.expiresAt ? 'ينتهي: ' + admin.formatDate(document.expiresAt) : (document.note || 'لا يوجد تاريخ انتهاء مسجل');
      return '<article class="document-row"><div><strong>' + admin.escapeHTML(document.name || document.type || 'مستند') + '</strong><span><bdi>' + admin.escapeHTML(expiry) + '</bdi></span></div>' + documentBadge(document) + '</article>';
    }).join('') + '</div>';
  }

  function maintenanceTab() {
    var records = Array.isArray(equipment.maintenance) ? equipment.maintenance : [];
    if (!records.length) return emptyState('لا يوجد سجل صيانة', 'لم تُسجل أعمال صيانة لهذه المعدة.');
    return '<div class="document-list">' + records.map(function (record) {
      return '<article class="document-row"><div><strong>' + admin.escapeHTML(record.title || record.type || 'صيانة') + '</strong><span>' + admin.escapeHTML(record.note || '') + '</span><small><bdi>' + admin.escapeHTML(admin.formatDate(record.date)) + '</bdi></small></div>' + badge(admin.recordStatusLabel(record.status), record.status === 'completed' ? 'verified' : 'pending') + '</article>';
    }).join('') + '</div>';
  }

  function notesTab() {
    var notes = Array.isArray(equipment.notes) ? equipment.notes : [];
    if (equipment.operationalNote) notes = [{ text: equipment.operationalNote, type: 'ملاحظة تشغيلية', at: equipment.updatedAt }].concat(notes);
    if (typeof equipment.notes === 'string' && equipment.notes) notes = [{ text: equipment.notes, type: 'ملاحظة تشغيلية', at: equipment.updatedAt }];
    if (!notes.length) return emptyState('لا توجد ملاحظات', 'لا توجد ملاحظات تشغيلية مسجلة على المعدة.');
    return '<div class="document-list">' + notes.map(function (note) {
      return '<article class="document-row equipment-note-row"><div><strong>' + admin.escapeHTML(note.type || note.title || 'ملاحظة') + '</strong><span>' + admin.escapeHTML(note.text || note.note || '') + '</span>' + (note.at || note.date ? '<small><bdi>' + admin.escapeHTML(admin.formatDateTime(note.at || note.date)) + '</bdi></small>' : '') + '</div></article>';

  function activityTab() {

      items: activityItems().map(function (item) { return { title: item.title, meta: item.meta, timeLabel: admin.formatDateTime(item.at) }; }),

      emptyDescription: 'ستظهر هنا الأنشطة الحقيقية المرتبطة بهذه المعدة وطلباتها.'

  }

  var tabRenderers = {
    overview: overviewTab,
    orders: ordersTab,
    bookings: bookingsTab,
    revenue: revenueTab,
    documents: documentsTab,
    maintenance: maintenanceTab,
    notes: notesTab,
    activity: activityTab
  };

  function renderTabs() {
    tabsHost.innerHTML = components.EntityTabs({ tabs: EQUIPMENT_TABS, active: currentTab, panelId: 'equipment-tab-panel', ariaLabel: 'أقسام ملف المعدة' });
    panel.innerHTML = tabRenderers[currentTab]();
  }

  function renderPage() {
    refreshHeader();
    renderTabs();
  }

  function openEdit() {
    editForm.elements.name.value = equipment.name || '';
    editForm.elements.category.value = equipment.category || '';
    editForm.elements.city.value = equipment.city || '';
    editForm.elements.dailyRate.value = typeof equipment.dailyRate === 'number' ? String(equipment.dailyRate) : '';
    editForm.elements.operationalNote.value = equipment.operationalNote || (typeof equipment.notes === 'string' ? equipment.notes : '');
    editForm.elements.ownerId.innerHTML = '<option value="">بدون مالك مرتبط</option>' + state.owners.map(function (item) {
      return '<option value="' + admin.escapeHTML(item.id) + '"' + (item.id === equipment.ownerId ? ' selected' : '') + '>' + admin.escapeHTML(item.name) + '</option>';
    }).join('');
    editDialog.showModal();
  }

  function closeEdit() { editDialog.close(); }
  function openStatus() {
    statusForm.elements.status.value = EQUIPMENT_STATUS[equipment.status] ? equipment.status : 'active';
    if (equipment.status === 'displayed') statusForm.elements.status.value = 'active';
    if (equipment.status === 'pending') statusForm.elements.status.value = 'pending_review';
    if (equipment.status === 'suspended') statusForm.elements.status.value = 'paused';
    statusDialog.showModal();
  }
  function closeStatus() { statusDialog.close(); }

  if (!equipment) {
    renderBreadcrumb();
    notFound.hidden = false;
    return;
  }

  content.hidden = false;
  renderPage();

  components.bindEntityTabs(tabsHost, function (tabId) {
    if (validTabs.indexOf(tabId) === -1) return;
    currentTab = tabId;
    history.replaceState(null, '', location.pathname + location.search + '#' + currentTab);
    renderTabs();
  });

  panel.addEventListener('click', function (event) {
    var control = event.target.closest('[data-open-tab]');
    if (!control || validTabs.indexOf(control.dataset.openTab) === -1) return;
    currentTab = control.dataset.openTab;
    history.replaceState(null, '', location.pathname + location.search + '#' + currentTab);
    renderTabs();
    panel.focus();
  });

  pageHeaderHost.addEventListener('click', function (event) {

    if (action.dataset.quickAction === 'edit') openEdit();
    if (action.dataset.quickAction === 'change-status') openStatus();

      var stopped = equipment.status === 'paused' || equipment.status === 'suspended';
      var nextStatus = stopped ? (equipment.previousStatus && equipment.previousStatus !== 'paused' && equipment.previousStatus !== 'suspended' ? equipment.previousStatus : 'active') : 'paused';
      var confirmation = stopped ? 'هل تريد تفعيل عرض هذه المعدة؟' : 'هل تريد إيقاف عرض هذه المعدة؟';
      if (!window.confirm(confirmation)) return;
      if (!stopped) equipment.previousStatus = equipment.status;
      equipment.status = nextStatus;
      addActivity(stopped ? 'equipment_activated' : 'equipment_paused', stopped ? 'تفعيل عرض المعدة' : 'إيقاف عرض المعدة');
      admin.saveState(state);
      renderPage();
      showToast(stopped ? 'تم تفعيل عرض المعدة.' : 'تم إيقاف عرض المعدة.');
    }
  });

  document.querySelectorAll('[data-close-equipment-edit]').forEach(function (button) { button.addEventListener('click', closeEdit); });
  document.querySelectorAll('[data-close-equipment-status]').forEach(function (button) { button.addEventListener('click', closeStatus); });
  editDialog.addEventListener('click', function (event) { if (event.target === editDialog) closeEdit(); });
  statusDialog.addEventListener('click', function (event) { if (event.target === statusDialog) closeStatus(); });

  editForm.addEventListener('submit', function (event) {
    event.preventDefault();
    if (!editForm.reportValidity()) return;
    var rateValue = editForm.elements.dailyRate.value;
    var previousName = equipment.name;
    equipment.name = editForm.elements.name.value.trim();
    equipment.category = editForm.elements.category.value.trim();
    equipment.city = editForm.elements.city.value.trim();
    equipment.ownerId = editForm.elements.ownerId.value;
    equipment.operationalNote = editForm.elements.operationalNote.value.trim();
    if (rateValue === '') delete equipment.dailyRate;
    else equipment.dailyRate = Math.max(0, Number(rateValue));
    state.orders.forEach(function (order) {
      if (order.equipmentId === equipment.id || (!order.equipmentId && order.equipment === previousName)) {
        order.equipmentId = equipment.id;
        order.equipment = equipment.name;
      }
    });
    addActivity('equipment_updated', 'تعديل بيانات المعدة');
    admin.saveState(state);
    closeEdit();
    renderPage();
    showToast('تم حفظ بيانات المعدة.');
  });

  statusForm.addEventListener('submit', function (event) {
    event.preventDefault();
    if (!statusForm.reportValidity()) return;
    var previous = equipment.status;
    equipment.status = statusForm.elements.status.value;
    if (equipment.status === 'paused' || equipment.status === 'suspended') equipment.previousStatus = previous;
    else delete equipment.previousStatus;
    addActivity('equipment_status', 'تغيير حالة المعدة من «' + (EQUIPMENT_STATUS[previous] || previous) + '» إلى «' + EQUIPMENT_STATUS[equipment.status] + '»');
    admin.saveState(state);
    closeStatus();
    renderPage();
    showToast('تم تحديث حالة المعدة.');
  });

  document.querySelector('[data-equipment-logout]').addEventListener('click', function () {
    admin.clearAuth();
    location.replace('login.html');
  });
})();

};

MOD["admin/order.js"] = function (location, history, localStorage, sessionStorage) {

(function () {
