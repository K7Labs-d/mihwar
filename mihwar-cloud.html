<style>
/* ===== assets/styles.css ===== */
/* ==========================================================================
   مِحور — نظام التصميم
   منصّة وساطة لتأجير معدات الإنشاءات. هوية صناعية: كهرماني السلامة + فولاذي.
   ========================================================================== */

:root {
  --primary: #B45309;
  --primary-hi: #D97706;
  --on-primary: #FFFFFF;
  --accent: #0E7490;

  --bg: #F7F6F4;
  --surface: #FFFFFF;
  --surface-2: #F0EEEA;
  --fg: #14181F;
  --fg-soft: #5B6472;

  --border: #DFDCD6;
  --ring: #B45309;

  --ok: #15803D;
  --ok-bg: #DCFCE7;
  --warn: #A16207;
  --warn-bg: #FEF3C7;

  --shadow: 0 18px 40px -26px rgba(20, 24, 31, .35);
  --shadow-lg: 0 40px 80px -44px rgba(20, 24, 31, .45);

  --radius: 16px;
  --radius-sm: 10px;
  --display: 'Tajawal', system-ui, sans-serif;
  --sans: 'Cairo', system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;

  color-scheme: light;
}

/* الوضع الليلي: تفضيل النظام كإشارة افتراضية، وسمة data-theme تتغلّب عليه */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --primary: #F59E0B;
    --primary-hi: #FBBF24;
    --on-primary: #1A1206;
    --accent: #22D3EE;

    --bg: #0B1220;
    --surface: #141C2B;
    --surface-2: #101827;
    --fg: #EEF2F7;
    --fg-soft: #9AA7B8;

    --border: #26334A;
    --ring: #F59E0B;

    --ok: #4ADE80;
    --ok-bg: #10291A;
    --warn: #FCD34D;
    --warn-bg: #2A2109;

    --shadow: 0 18px 40px -26px rgba(0, 0, 0, .7);
    --shadow-lg: 0 40px 80px -44px rgba(0, 0, 0, .8);

    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --primary: #F59E0B;
  --primary-hi: #FBBF24;
  --on-primary: #1A1206;
  --accent: #22D3EE;

  --bg: #0B1220;
  --surface: #141C2B;
  --surface-2: #101827;
  --fg: #EEF2F7;
  --fg-soft: #9AA7B8;

  --border: #26334A;
  --ring: #F59E0B;

  --ok: #4ADE80;
  --ok-bg: #10291A;
  --warn: #FCD34D;
  --warn-bg: #2A2109;

  --shadow: 0 18px 40px -26px rgba(0, 0, 0, .7);
  --shadow-lg: 0 40px 80px -44px rgba(0, 0, 0, .8);

  color-scheme: dark;
}

/* ============================== الأساسيات ============================== */

*, *::before, *::after { box-sizing: border-box; }

html { scroll-behavior: smooth; }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4 {
  font-family: var(--display);
  font-weight: 800;
  line-height: 1.25;
  margin: 0;
  letter-spacing: -.01em;
}

p { margin: 0; }
img, svg { max-width: 100%; }
a { color: inherit; }

:where(a, button, input, select, textarea, summary, [tabindex]):focus-visible {
  outline: 3px solid var(--ring);
  outline-offset: 2px;
  border-radius: 4px;
}

.shell { width: min(1180px, calc(100% - 2.5rem)); margin-inline: auto; }

.skip-link {
  position: absolute;
  inset-block-start: -100%;
  inset-inline-start: 1rem;
  z-index: 100;
  padding: .75rem 1.25rem;
  background: var(--primary);
  color: var(--on-primary);
  border-radius: 0 0 var(--radius-sm) var(--radius-sm);
  font-weight: 700;
  text-decoration: none;
}
.skip-link:focus { inset-block-start: 0; }

.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}

/* ================================ أزرار ================================ */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: .5rem;
  padding: .8rem 1.5rem;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  font-family: var(--sans);
  font-size: .95rem;
  font-weight: 700;
  text-decoration: none;
  cursor: pointer;
  transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
}
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(0); }

.btn-primary { background: var(--primary); color: var(--on-primary); box-shadow: var(--shadow); }
.btn-primary:hover { background: var(--primary-hi); }

.btn-ghost { background: transparent; color: var(--fg); border-color: var(--border); }
.btn-ghost:hover { background: var(--surface-2); }

.btn-block { width: 100%; }
.btn-lg { padding: 1rem 2rem; font-size: 1.05rem; }

/* ================================ شارات ================================ */

.badge {
  display: inline-flex;
  align-items: center;
  gap: .4rem;
  padding: .3rem .75rem;
  border-radius: 999px;
  font-size: .8rem;
  font-weight: 700;
  line-height: 1.5;
}
.badge-ok { background: var(--ok-bg); color: var(--ok); }
.badge-warn { background: var(--warn-bg); color: var(--warn); }
.badge-neutral { background: var(--surface-2); color: var(--fg-soft); border: 1px solid var(--border); }

.badge svg { width: 1em; height: 1em; flex-shrink: 0; }

/* =============================== الترويسة =============================== */

.site-header {
  position: sticky;
  inset-block-start: 0;
  z-index: 50;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(12px);
  border-block-end: 1px solid var(--border);
}

.header-inner {
  display: flex;
  align-items: center;
  gap: 1.5rem;
  padding-block: .9rem;
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: .65rem;
  font-family: var(--display);
  font-size: 1.35rem;
  font-weight: 800;
  text-decoration: none;
  color: var(--fg);
  flex-shrink: 0;
}
.brand-mark { width: 2.25rem; height: 2.25rem; flex-shrink: 0; }
.brand small {
  display: block;
  font-family: var(--sans);
  font-size: .62rem;
  font-weight: 600;
  color: var(--fg-soft);
  letter-spacing: .06em;
  line-height: 1;
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 1.5rem;
  margin-inline-start: auto;
}
.nav-links a {
  font-size: .93rem;
  font-weight: 600;
  color: var(--fg-soft);
  text-decoration: none;
  transition: color .15s ease;
}
.nav-links a:hover { color: var(--primary); }

.header-actions { display: flex; align-items: center; gap: .6rem; flex-shrink: 0; }

.icon-btn {
  display: grid;
  place-items: center;
  width: 2.5rem;
  height: 2.5rem;
  padding: 0;
  background: var(--surface);
  color: var(--fg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background .15s ease;
}
.icon-btn:hover { background: var(--surface-2); }
.icon-btn svg { width: 1.2rem; height: 1.2rem; }

.nav-toggle { display: none; }

/* أيقونتا الوضع: الشمس تظهر في الليلي فقط */
.icon-sun { display: none; }
:root[data-theme="dark"] .icon-sun { display: block; }
:root[data-theme="dark"] .icon-moon { display: none; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .icon-sun { display: block; }
  :root:not([data-theme="light"]) .icon-moon { display: none; }
}

@media (max-width: 900px) {
  .nav-toggle { display: grid; margin-inline-start: auto; }
  .nav-links {
    position: fixed;
    inset: 4.3rem 0 auto 0;
    flex-direction: column;
    align-items: stretch;
    gap: 0;
    margin: 0;
    padding: 1rem 1.25rem 1.5rem;
    background: var(--surface);
    border-block-end: 1px solid var(--border);
    box-shadow: var(--shadow);
  }
  .nav-links[hidden] { display: none; }
  .nav-links a { padding-block: .8rem; border-block-end: 1px solid var(--border); }
  .header-actions .btn { display: none; }
}

/* ================================ أقسام ================================ */

.section { padding-block: clamp(3.5rem, 7vw, 6rem); }
.section-alt { background: var(--surface-2); }

.section-head { max-width: 45rem; margin-block-end: 2.75rem; }
.section-head.center { margin-inline: auto; text-align: center; }

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: .5rem;
  margin-block-end: .75rem;
  color: var(--primary);
  font-size: .78rem;
  font-weight: 800;
  letter-spacing: .1em;
}
.eyebrow::before { content: ""; width: 1.75rem; height: 2px; background: currentColor; }
.section-head.center .eyebrow::after { content: ""; width: 1.75rem; height: 2px; background: currentColor; }

.section-head h2 { font-size: clamp(1.75rem, 3.6vw, 2.6rem); }
.section-head p { margin-block-start: .85rem; color: var(--fg-soft); font-size: 1.05rem; }

/* ================================ الهيرو ================================ */

.hero { padding-block: clamp(3rem, 6vw, 5.5rem) clamp(2.5rem, 5vw, 4rem); }

.hero-grid {
  display: grid;
  grid-template-columns: 1.15fr .85fr;
  gap: clamp(2rem, 5vw, 4rem);
  align-items: center;
}

.hero h1 { font-size: clamp(2.1rem, 5.4vw, 3.9rem); }
.hero h1 .hl { color: var(--primary); }
.hero-lead {
  margin-block-start: 1.25rem;
  max-width: 34rem;
  color: var(--fg-soft);
  font-size: clamp(1rem, 1.6vw, 1.15rem);
}

.hero-note {
  display: flex;
  align-items: flex-start;
  gap: .6rem;
  margin-block-start: 1.5rem;
  padding: .85rem 1.1rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-inline-start: 3px solid var(--accent);
  border-radius: var(--radius-sm);
  color: var(--fg-soft);
  font-size: .9rem;
  line-height: 1.65;
}
.hero-note svg { width: 1.15rem; height: 1.15rem; flex-shrink: 0; color: var(--accent); margin-block-start: .2rem; }
.hero-note strong { color: var(--fg); }

.hero-art {
  padding: 1.5rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
}

@media (max-width: 900px) {
  .hero-grid { grid-template-columns: 1fr; }
  .hero-art { order: -1; }
}

/* ============================== شريط البحث ============================== */

.search-bar {
  display: grid;
  grid-template-columns: repeat(3, 1fr) auto;
  gap: .75rem;
  margin-block-start: 1.75rem;
  padding: .85rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

.field { display: flex; flex-direction: column; gap: .3rem; min-width: 0; }
.field > label { font-size: .74rem; font-weight: 700; color: var(--fg-soft); }

.field input, .field select {
  width: 100%;
  padding: .6rem .7rem;
  background: var(--bg);
  color: var(--fg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-family: var(--sans);
  font-size: .92rem;
}

@media (max-width: 760px) {
  .search-bar { grid-template-columns: 1fr; }
}

/* ============================== شريط الأرقام ============================== */

.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.stat { padding: 1.5rem 1.25rem; background: var(--surface); text-align: center; }
.stat strong {
  display: block;
  font-family: var(--display);
  font-size: clamp(1.6rem, 3vw, 2.2rem);
  font-weight: 800;
  color: var(--primary);
  line-height: 1.2;
}
.stat span { font-size: .85rem; color: var(--fg-soft); }

@media (max-width: 700px) { .stats { grid-template-columns: repeat(2, 1fr); } }

/* =============================== الشبكات =============================== */

.grid { display: grid; gap: 1.25rem; }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
.grid-2 { grid-template-columns: repeat(2, 1fr); }

@media (max-width: 960px) {
  .grid-4 { grid-template-columns: repeat(2, 1fr); }
  .grid-3 { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 620px) {
  .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr; }
}

/* ================================ بطاقات ================================ */

.card {
  padding: 1.5rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  transition: transform .18s ease, box-shadow .18s ease;
}
.card h3 { font-size: 1.15rem; margin-block-end: .5rem; }
.card p { color: var(--fg-soft); font-size: .93rem; }

.card-icon {
  display: grid;
  place-items: center;
  width: 3rem;
  height: 3rem;
  margin-block-end: 1rem;
  background: var(--surface-2);
  color: var(--primary);
  border-radius: var(--radius-sm);
}
.card-icon svg { width: 1.5rem; height: 1.5rem; }

/* بطاقة فئة — قابلة للنقر لتصفية الشبكة */
.cat-card {
  display: block;
  width: 100%;
  padding: 1.35rem 1.25rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-family: var(--sans);
  color: var(--fg);
  text-align: start;
  cursor: pointer;
  transition: border-color .18s ease, transform .18s ease;
}
.cat-card:hover { border-color: var(--primary); transform: translateY(-2px); }
.cat-card[aria-pressed="true"] {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}
.cat-card strong { display: block; font-family: var(--display); font-size: 1.05rem; }
.cat-card span { font-size: .82rem; color: var(--fg-soft); }

/* عدّاد المعدات في الفئة — يُملأ من البيانات وقت التشغيل */
.cat-count {
  display: inline-block;
  margin-block-start: .6rem;
  padding: .12rem .5rem;
  border-radius: 999px;
  background: var(--surface-2);
  color: var(--fg-soft);
  font-size: .72rem;
  font-style: normal;
  font-weight: 700;
}
.cat-count:empty { display: none; }

/* رسوم المعدات نسبتها 16:10 — إطار مربّع يضغطها لحجم غير مقروء */
.cat-card .card-icon { width: 4.25rem; height: 3rem; }
.cat-card .card-icon svg { width: 3.25rem; height: auto; }

/* ============================== بطاقة معدة ============================== */

.eq-card {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
.eq-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); border-color: var(--primary); }
.eq-card[hidden] { display: none; }

.eq-media {
  position: relative;
  aspect-ratio: 16 / 10;
  background: var(--surface-2);
  border-block-end: 1px solid var(--border);
}
.eq-media svg { width: 100%; height: 100%; display: block; }
.eq-media .badge { position: absolute; inset-block-start: .75rem; inset-inline-start: .75rem; }

.eq-body { display: flex; flex-direction: column; flex: 1; padding: 1.15rem 1.25rem 1.35rem; }
.eq-body h3 { font-size: 1.08rem; }
.eq-body h3 a { text-decoration: none; }
.eq-body h3 a:hover { color: var(--primary); }
.eq-meta { margin-block-start: .3rem; color: var(--fg-soft); font-size: .84rem; }

.eq-specs {
  display: flex;
  flex-wrap: wrap;
  gap: .4rem;
  margin-block: .9rem;
  padding: 0;
  list-style: none;
}
.eq-specs li {
  padding: .2rem .6rem;
  background: var(--surface-2);
  border-radius: 999px;
  font-size: .76rem;
  color: var(--fg-soft);
}

.eq-foot {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: .75rem;
  margin-block-start: auto;
  padding-block-start: .9rem;
  border-block-start: 1px solid var(--border);
}
/* صيغة السعر: «يبدأ من X ر.س / يوم» — الرقم وحده هو المبرز */
.eq-price { margin: 0; font-size: .8rem; color: var(--fg-soft); line-height: 1.6; }
.eq-price strong { font-family: var(--display); font-size: 1.25rem; color: var(--primary); }

.empty-state {
  padding: 3rem 1.5rem;
  text-align: center;
  color: var(--fg-soft);
  border: 1px dashed var(--border);
  border-radius: var(--radius);
}
.empty-state[hidden] { display: none; }

/* ============================== خطوات العمل ============================== */

.steps { counter-reset: step; }
.step { position: relative; padding-inline-start: 3.5rem; }
.step::before {
  counter-increment: step;
  content: counter(step);
  position: absolute;
  inset-inline-start: 0;
  inset-block-start: 0;
  display: grid;
  place-items: center;
  width: 2.5rem;
  height: 2.5rem;
  background: var(--primary);
  color: var(--on-primary);
  border-radius: 50%;
  font-family: var(--display);
  font-weight: 800;
}
.step h3 { font-size: 1.08rem; margin-block-end: .35rem; }
.step p { color: var(--fg-soft); font-size: .92rem; }

/* ============================== الأسئلة الشائعة ============================== */

.faq { max-width: 48rem; margin-inline: auto; }
.faq-item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  margin-block-end: .75rem;
  overflow: hidden;
}
.faq-q {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  width: 100%;
  padding: 1.1rem 1.25rem;
  background: none;
  border: 0;
  color: var(--fg);
  font-family: var(--display);
  font-size: 1rem;
  font-weight: 700;
  text-align: start;
  cursor: pointer;
}
.faq-q svg { width: 1.1rem; height: 1.1rem; flex-shrink: 0; color: var(--primary); transition: transform .2s ease; }
.faq-q[aria-expanded="true"] svg { transform: rotate(45deg); }
.faq-a { padding: 0 1.25rem 1.25rem; color: var(--fg-soft); font-size: .95rem; }
.faq-a[hidden] { display: none; }

/* ============================== شريط الدعوة ============================== */

.cta-band {
  padding: clamp(2.5rem, 5vw, 3.5rem);
  background: linear-gradient(135deg, var(--primary), var(--primary-hi));
  color: var(--on-primary);
  border-radius: var(--radius);
  text-align: center;
}
.cta-band h2 { font-size: clamp(1.6rem, 3.4vw, 2.3rem); }
.cta-band p { margin-block: .85rem 1.75rem; opacity: .92; }
.cta-band .btn { background: var(--on-primary); color: var(--primary); }

/* =============================== التذييل =============================== */

.site-footer {
  padding-block: 3rem 2rem;
  background: var(--surface);
  border-block-start: 1px solid var(--border);
}
.footer-grid {
  display: grid;
  grid-template-columns: 1.4fr repeat(3, 1fr);
  gap: 2rem;
  margin-block-end: 2rem;
}
.footer-grid h4 { font-size: .95rem; margin-block-end: .85rem; }
.footer-grid ul { margin: 0; padding: 0; list-style: none; }
.footer-grid li { margin-block-end: .5rem; }
.footer-grid a { color: var(--fg-soft); font-size: .9rem; text-decoration: none; }
.footer-grid a:hover { color: var(--primary); }
.footer-about p { color: var(--fg-soft); font-size: .9rem; margin-block-start: .85rem; }

.footer-bottom {
  padding-block-start: 1.5rem;
  border-block-start: 1px solid var(--border);
  color: var(--fg-soft);
  font-size: .84rem;
}
.footer-disclaimer {
  margin-block-end: .75rem;
  padding: .85rem 1.1rem;
  background: var(--surface-2);
  border-radius: var(--radius-sm);
  line-height: 1.7;
}
.footer-disclaimer strong { color: var(--fg); }

@media (max-width: 860px) { .footer-grid { grid-template-columns: 1fr 1fr; } }
@media (max-width: 520px) { .footer-grid { grid-template-columns: 1fr; } }

/* ==========================================================================
   صفحة المعدة
   ========================================================================== */

.breadcrumb { padding-block: 1.25rem; font-size: .85rem; color: var(--fg-soft); }
.breadcrumb ol { display: flex; flex-wrap: wrap; gap: .5rem; margin: 0; padding: 0; list-style: none; }
.breadcrumb li::after { content: "/"; margin-inline-start: .5rem; color: var(--border); }
.breadcrumb li:last-child::after { content: ""; }
.breadcrumb a { text-decoration: none; }
.breadcrumb a:hover { color: var(--primary); }

/* ثلاث مناطق كي تصعد لوحة الطلب فوق التفاصيل على الجوّال
   بدل أن تُدفن أسفل الصفحة، مع بقائها عموداً جانبياً على سطح المكتب. */
.eq-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 22rem;
  grid-template-areas:
    "head    booking"
    "detail  booking";
  gap: 0 2.5rem;
  align-items: start;
  padding-block-end: 4rem;
}
.eq-head { grid-area: head; }
.eq-detail { grid-area: detail; }
.eq-booking { grid-area: booking; }

@media (max-width: 1000px) {
  .eq-layout {
    grid-template-columns: 1fr;
    grid-template-areas: "head" "booking" "detail";
    gap: 2rem;
  }
}

.eq-title { font-size: clamp(1.6rem, 3.6vw, 2.4rem); margin-block: .75rem .6rem; }
.eq-badges { display: flex; flex-wrap: wrap; gap: .5rem; }
.eq-sub { margin-block-start: .75rem; color: var(--fg-soft); }

/* ------------------------------ المعرض ------------------------------ */

.gallery { margin-block-start: 1.75rem; }
.gallery-main {
  display: grid;
  place-items: center;
  aspect-ratio: 16 / 10;
  padding: 1.5rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
/* سقف للعرض: تمدّد الرسم لكامل الإطار يجعل سماكة الخط تتضخّم معه */
.gallery-main svg { width: min(100%, 28rem); height: auto; display: block; }
.gallery-main > svg[hidden] { display: none; }

.gallery-thumbs { display: flex; gap: .6rem; margin-block-start: .75rem; }
.gallery-thumb {
  flex: 1;
  padding: 0;
  aspect-ratio: 16 / 10;
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  overflow: hidden;
  cursor: pointer;
  transition: border-color .15s ease;
}
.gallery-thumb svg { width: 100%; height: 100%; display: block; }
.gallery-thumb[aria-selected="true"] { border-color: var(--primary); }

/* ---------------------------- بطاقة المورّد ---------------------------- */

.supplier {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 1.25rem;
  margin-block-start: 1.75rem;
  padding: 1.35rem 1.5rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.supplier-avatar {
  display: grid;
  place-items: center;
  width: 3.25rem;
  height: 3.25rem;
  flex-shrink: 0;
  background: var(--surface-2);
  color: var(--primary);
  border-radius: 50%;
  font-family: var(--display);
  font-size: 1.2rem;
  font-weight: 800;
}
.supplier-info { flex: 1; min-width: 12rem; }
.supplier-info strong { display: block; font-family: var(--display); font-size: 1.05rem; }
.supplier-info span { font-size: .85rem; color: var(--fg-soft); }
.supplier-docs { display: flex; flex-wrap: wrap; gap: .5rem; }

/* ------------------------------ التبويبات ------------------------------ */

.tabs { margin-block-start: 2.5rem; }
.tablist {
  display: flex;
  flex-wrap: wrap;
  gap: .35rem;
  border-block-end: 1px solid var(--border);
}
.tab {
  padding: .75rem 1.15rem;
  background: none;
  border: 0;
  border-block-end: 2px solid transparent;
  color: var(--fg-soft);
  font-family: var(--sans);
  font-size: .93rem;
  font-weight: 700;
  cursor: pointer;
  transition: color .15s ease, border-color .15s ease;
}
.tab:hover { color: var(--fg); }
.tab[aria-selected="true"] { color: var(--primary); border-block-end-color: var(--primary); }

.tabpanel { padding-block-start: 1.75rem; }
.tabpanel[hidden] { display: none; }
.tabpanel h3 { font-size: 1.15rem; margin-block-end: .85rem; }
.tabpanel > p { color: var(--fg-soft); margin-block-end: 1.25rem; }

/* ------------------------------ الجداول ------------------------------ */

.table-wrap { overflow-x: auto; }
.spec-table { width: 100%; border-collapse: collapse; font-size: .93rem; }
.spec-table th, .spec-table td {
  padding: .8rem 1rem;
  text-align: start;
  border-block-end: 1px solid var(--border);
}
.spec-table th { width: 45%; font-weight: 700; color: var(--fg-soft); background: var(--surface-2); }
.spec-table tr:last-child th, .spec-table tr:last-child td { border-block-end: 0; }
.spec-table { border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }

/* --------------------------- قوائم مشمول/غير مشمول --------------------------- */

.check-list { margin: 0; padding: 0; list-style: none; }
.check-list li {
  display: flex;
  align-items: flex-start;
  gap: .6rem;
  padding-block: .5rem;
  font-size: .93rem;
  color: var(--fg-soft);
}
.check-list svg { width: 1.15rem; height: 1.15rem; flex-shrink: 0; margin-block-start: .28rem; }
.check-list.yes svg { color: var(--ok); }
.check-list.no svg { color: var(--fg-soft); opacity: .7; }

.owner-note {
  display: flex;
  align-items: flex-start;
  gap: .6rem;
  margin-block-start: 1.25rem;
  padding: .9rem 1.1rem;
  background: var(--surface-2);
  border-inline-start: 3px solid var(--accent);
  border-radius: var(--radius-sm);
  color: var(--fg-soft);
  font-size: .88rem;
  line-height: 1.7;
}
.owner-note svg { width: 1.1rem; height: 1.1rem; flex-shrink: 0; color: var(--accent); margin-block-start: .25rem; }

/* ---------------------------- لوحة طلب التأجير ---------------------------- */

.booking {
  position: sticky;
  inset-block-start: 5.5rem;
  padding: 1.5rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);

.booking .btn { margin-block-start: 1.25rem; }

.booking-note {

  <!-- ============================ الأسئلة الشائعة ============================ -->
  <section class="section" id="faq">
    <div class="shell">
      <div class="section-head center">
        <span class="eyebrow">قبل أن تسأل</span>
        <h2>الأسئلة الشائعة</h2>
      </div>

      <div class="faq">
        <div class="faq-item">
          <button class="faq-q" type="button" aria-expanded="true" aria-controls="faq-a1" id="faq-q1">
            هل مِحور يملك المعدات؟
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <div class="faq-a" id="faq-a1" role="region" aria-labelledby="faq-q1">
            لا. مِحور منصّة وساطة تعرض معدّات يملكها مقاولون ومؤسسات تأجير. نحن لا نملك المعدات
            ولا نشغّلها ولا نتولّى تسليمها. دورنا هو التحقق من مستندات المعدة قبل إدراجها، وعرض
            بياناتها وشروط مالكها بوضوح، ثم ربطك به مباشرة.
          </div>
        </div>

        <div class="faq-item">
          <button class="faq-q" type="button" aria-expanded="false" aria-controls="faq-a2" id="faq-q2">
            ماذا يعني «مستندات محقّقة»؟
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <div class="faq-a" id="faq-a2" role="region" aria-labelledby="faq-q2" hidden>
            يعني أننا طلبنا من المالك — قبل إدراج المعدة — استمارة المعدة، وشهادة الفحص الدوري
            السارية، وما يثبت ملكيته لها، وتحققنا من أن هذه المستندات سارية وتطابق المعدة المعروضة.
            هذا تحقق من الأوراق وقت الإدراج، وليس فحصاً فنياً للمعدة ولا ضماناً لحالتها.
          </div>
        </div>

        <div class="faq-item">
          <button class="faq-q" type="button" aria-expanded="false" aria-controls="faq-a3" id="faq-q3">
            من يتحمّل الصيانة والأعطال أثناء التأجير؟
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <div class="faq-a" id="faq-a3" role="region" aria-labelledby="faq-q3" hidden>
            هذا يُحدَّد في العقد بينك وبين المالك، ويختلف من مالك لآخر. اقرأ تبويب «شروط المالك»
            في صفحة المعدة قبل الاتفاق. مِحور لا يقدّم صيانة ولا يتحمّل تبعات الأعطال.
          </div>
        </div>

        <div class="faq-item">
          <button class="faq-q" type="button" aria-expanded="false" aria-controls="faq-a4" id="faq-q4">
            هل هناك تأمين على المعدة؟
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <div class="faq-a" id="faq-a4" role="region" aria-labelledby="faq-q4" hidden>
            مِحور لا يوفّر تأميناً. بعض الملاك يشترطون وثيقة تأمين وبعضهم يوفّرها ضمن السعر —
            راجع شروط المالك في صفحة المعدة، واتفق معه على التغطية كتابةً قبل الاستلام.
          </div>
        </div>

        <div class="faq-item">
          <button class="faq-q" type="button" aria-expanded="false" aria-controls="faq-a5" id="faq-q5">
            ماذا لو لم تكن المعدة متاحة في الموعد؟
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <div class="faq-a" id="faq-a5" role="region" aria-labelledby="faq-q5" hidden>
            التوفّر يؤكده المالك عند ردّه على طلبك، ولهذا لا يُعدّ الطلب حجزاً مؤكداً حتى يؤكده هو.
            مِحور لا يضمن التوفّر ولا يوفّر معدة بديلة، لكن يمكنك تصفّح معدّات أخرى مطابقة في المنصّة
            وإرسال طلب لأكثر من مالك.
          </div>
        </div>

        <div class="faq-item">
          <button class="faq-q" type="button" aria-expanded="false" aria-controls="faq-a6" id="faq-q6">
            كيف تُحتسب الأسعار؟
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <div class="faq-a" id="faq-a6" role="region" aria-labelledby="faq-q6" hidden>
            الأسعار المعروضة من المالك بالريال السعودي قبل ضريبة القيمة المضافة (15%)، وتُضاف
            الضريبة في ملخّص التكلفة. أسعار الأسبوع والشهر أقل من مجموع الأيام. الرقم الظاهر
            تقدير حتى يعتمده المالك.
          </div>
        </div>
      </div>
    </div>
  </section>

     تخدم كل معدة لا تملك صفحة مكتوبة يدوياً، وتُبنى من نفس بيانات الكتالوج.
     ============================================================== */

  function specTable(rows) {
    if (!rows.length) return '<p class="empty-state">لم يسجّل المالك تفاصيل في هذا القسم بعد.</p>';
    return '<div class="table-wrap"><table class="spec-table"><tbody>' + rows.map(function (row) {
      return '<tr><th scope="row">' + data.escapeHTML(row.label) + '</th><td>' + data.escapeHTML(row.value) + '</td></tr>';
    }).join('') + '</tbody></table></div>';
  }

  function checkList(items, kind) {
    if (!items.length) return '<p class="empty-state">لا توجد عناصر مسجّلة.</p>';
    var icon = kind === 'no' ? '#i-dash' : '#i-check';
    return '<ul class="check-list ' + kind + '">' + items.map(function (item) {
      return '<li><svg aria-hidden="true"><use href="' + icon + '"/></svg> ' + data.escapeHTML(item) + '</li>';
    }).join('') + '</ul>';
  }

  function setText(selector, value) {
    var el = document.querySelector(selector);
    if (el) el.textContent = value;
  }

  function setHTML(selector, value) {
    var el = document.querySelector(selector);
    if (el) el.innerHTML = value;
  }

  function initEquipmentPage() {
    var host = document.querySelector('[data-equipment-page]');
    if (!host || !data) return;

    var state = data.load();
    var id = new URLSearchParams(location.search).get('id');
    var item = state.equipment.find(function (row) { return row.id === id || row.slug === id; });

    if (!item || !data.isListed(item)) {
      var missing = document.querySelector('[data-equipment-missing]');
      if (missing) missing.hidden = false;
      return;
    }

    // المعدة التي لها صفحة مكتوبة يدوياً تُحوَّل إليها بدل تكرار المحتوى
    if (item.detailPath) {
      location.replace('../' + item.detailPath);
      return;
    }

    var owner = state.owners.find(function (row) { return row.id === item.ownerId; });
    var ownerLabel = owner ? owner.name : 'مالك غير محدد';
    var rates = data.rates(item);

    document.title = item.name + ' للتأجير — مِحور';
    var description = document.querySelector('meta[name="description"]');
    if (description) {
      description.setAttribute('content', item.name + ' للتأجير في ' + item.city + ' من ' + ownerLabel +
        '. المواصفات وشروط المالك وتقدير استرشادي للتكلفة عبر منصّة مِحور.');
    }

    host.hidden = false;

    setText('[data-eq-crumb-category]', item.category);
    setText('[data-eq-crumb-name]', item.name);
    setText('[data-eq-city-badge]', item.city);
    setHTML('[data-eq-availability]', availabilityBadge(item));
    setText('[data-eq-title]', item.name);
    setHTML('[data-eq-sub]',
      (item.model ? data.escapeHTML(item.model) + ' — ' : '') + data.escapeHTML(item.summary || '') +
      ' معروضة من <strong>' + data.escapeHTML(ownerLabel) + '</strong>.');
    setHTML('[data-eq-icon]', '<use href="#' + data.escapeHTML(item.icon) + '"/>');

    setText('[data-eq-owner-avatar]', ownerLabel.trim().charAt(0) || 'م');
    setText('[data-eq-owner-name]', ownerLabel);
    setText('[data-eq-owner-meta]',
      'مالك المعدة · ' + item.city + (owner && owner.memberSince ? ' · مُدرج في مِحور منذ ' + owner.memberSince : ''));
    setHTML('[data-eq-owner-docs]', item.documents
      .filter(function (doc) { return doc.status === 'verified'; })
      .map(function (doc) {
        return '<span class="badge badge-ok"><svg aria-hidden="true"><use href="#i-check"/></svg> ' +
          data.escapeHTML(doc.name || doc.type) + '</span>';
      }).join('') || '<span class="badge badge-neutral">مستندات قيد المراجعة</span>');

    setHTML('[data-eq-specs]', specTable(item.specs));
    setHTML('[data-eq-terms]', specTable(item.terms));
    setHTML('[data-eq-included]', checkList(item.included, 'yes'));
    setHTML('[data-eq-excluded]', checkList(item.excluded, 'no'));
    setHTML('[data-eq-renter-docs]', checkList(data.RENTER_DOCUMENTS, 'yes'));
    setHTML('[data-eq-verified-docs]', checkList(data.VERIFIED_DOCUMENTS, 'yes'));
    setText('[data-eq-owner-terms-name]', ownerLabel);

    // معدات ذات صلة — من نفس الفئة أولاً ثم من بقية الكتالوج
    var related = state.equipment.filter(function (row) {
      return row.id !== item.id && data.isListed(row);
    }).sort(function (a, b) {
      return (b.category === item.category ? 1 : 0) - (a.category === item.category ? 1 : 0);
    }).slice(0, 3);

    setHTML('[data-eq-related]', related.map(function (row) {
      return '<div class="card"><h3>' + data.escapeHTML(row.name) + '</h3>' +
        '<p>' + data.escapeHTML(row.highlights.join(' · ')) + ' · ' + data.escapeHTML(row.city) + '</p>' +
        '<p class="eq-price" style="margin-block-start:.75rem">يبدأ من <strong>' +
        data.escapeHTML(data.formatRiyal(row.dailyRate)) + '</strong> / يوم</p>' +
        '<a class="btn btn-ghost" href="' + data.escapeHTML(data.detailHref(row, '../')) +
        '" style="margin-block-start:1rem">التفاصيل</a></div>';
    }).join(''));

    var form = document.querySelector('[data-booking-form]');
    if (form) form.dataset.equipmentId = item.id;

    setText('[data-eq-operator-note]', data.formatRiyal(data.operatorRate(item)) + ' / يوم تشغيل');
    setText('[data-eq-transport-note]', data.formatRiyal(data.transportRate(item)) + ' ذهاباً وإياباً');
    setText('[data-eq-week-rate]', data.formatRiyal(rates.week));
    setText('[data-eq-month-rate]', data.formatRiyal(rates.month));
  }

  /* --------------------- حاسبة السعر (صفحة المعدة) --------------------- */

  function initCalculator() {
    var form = document.querySelector('[data-booking-form]');
    if (!form || !data) return;

    var state = data.load();
    var equipmentId = form.dataset.equipmentId;
    var item = state.equipment.find(function (row) { return row.id === equipmentId; });
    if (!item) return;

    var owner = state.owners.find(function (row) { return row.id === item.ownerId; });

    // كل الأرقام استرشادية (placeholder) — راجع mihwar/README.md
    var RATES = data.rates(item);
    var UNIT_LABEL = { day: 'يوم', week: 'أسبوع', month: 'شهر' };
    var DAYS_IN = { day: 1, week: 7, month: 30 };
    var OPERATOR_PER_DAY = data.operatorRate(item);
    var TRANSPORT_FLAT = data.transportRate(item);

    var els = {
      qty: form.querySelector('[data-qty-input]'),
      operator: form.querySelector('[data-opt-operator]'),
      transport: form.querySelector('[data-opt-transport]'),
      start: form.querySelector('[data-start-date]'),
      dateError: form.querySelector('[data-date-error]'),
      renter: form.querySelector('[data-renter-name]'),
      phone: form.querySelector('[data-renter-phone]'),
      location: form.querySelector('[data-renter-location]'),
      formError: form.querySelector('[data-booking-error]'),
      submit: form.querySelector('button[type="submit"]'),
      status: document.querySelector('[data-booking-status]')
    };

    var out = {
      headline: document.querySelector('[data-price-headline]'),
      headlineUnit: document.querySelector('[data-price-unit]'),
      base: document.querySelector('[data-sum-base]'),
      baseLabel: document.querySelector('[data-sum-base-label]'),
      operatorRow: document.querySelector('[data-row-operator]'),
      operator: document.querySelector('[data-sum-operator]'),
      transportRow: document.querySelector('[data-row-transport]'),
      transport: document.querySelector('[data-sum-transport]'),
      vat: document.querySelector('[data-sum-vat]'),
      total: document.querySelector('[data-sum-total]')
    };

    function riyal(n) { return data.formatRiyal(Math.round(n)); }

    function currentPeriod() {
      var checked = form.querySelector('[name="period"]:checked');
      return checked ? checked.value : 'day';
    }

    function totals() {
      var period = currentPeriod();
      var qty = Math.max(1, Math.min(10, parseInt(els.qty.value, 10) || 1));
      var rate = RATES[period];

      var base = rate * qty;
      var operatorFee = els.operator && els.operator.checked ? OPERATOR_PER_DAY * DAYS_IN[period] * qty : 0;
      var transportFee = els.transport && els.transport.checked ? TRANSPORT_FLAT * qty : 0;
      var subtotal = base + operatorFee + transportFee;

      return {
        period: period, qty: qty, rate: rate, base: base,
        operatorFee: operatorFee, transportFee: transportFee,
        subtotal: subtotal, vat: subtotal * data.VAT, total: subtotal * (1 + data.VAT)
      };
    }

    function recalc() {
      var sum = totals();

      if (out.headline) out.headline.textContent = riyal(sum.rate);
      if (out.headlineUnit) out.headlineUnit.textContent = '/ ' + UNIT_LABEL[sum.period];
      if (out.baseLabel) out.baseLabel.textContent = 'الإيجار (' + sum.qty + ' × ' + UNIT_LABEL[sum.period] + ')';
      if (out.base) out.base.textContent = riyal(sum.base);

      if (out.operatorRow) out.operatorRow.hidden = sum.operatorFee === 0;
      if (out.operator) out.operator.textContent = riyal(sum.operatorFee);
      if (out.transportRow) out.transportRow.hidden = sum.transportFee === 0;
      if (out.transport) out.transport.textContent = riyal(sum.transportFee);

      if (out.vat) out.vat.textContent = riyal(sum.vat);
      if (out.total) out.total.textContent = riyal(sum.total);
    }

    // منع التواريخ الماضية
    var todayISO = data.todayISO();
    if (els.start) {
      els.start.min = todayISO;
      els.start.addEventListener('change', function () {
        var invalid = els.start.value !== '' && els.start.value < todayISO;
        if (els.dateError) els.dateError.hidden = !invalid;
        els.start.setAttribute('aria-invalid', String(invalid));
      });
    }

    // أزرار العدد
    form.querySelectorAll('[data-qty-step]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var step = parseInt(btn.dataset.qtyStep, 10);
        var next = (parseInt(els.qty.value, 10) || 1) + step;
        els.qty.value = String(Math.max(1, Math.min(10, next)));
        recalc();
      });
    });

    form.addEventListener('change', recalc);
    form.addEventListener('input', recalc);

    function fail(message, field) {
      if (els.formError) {
        els.formError.textContent = message;
        els.formError.hidden = false;
      }
      if (field) field.focus();
    }

    function addDays(iso, days) {
      var end = new Date(iso + 'T12:00:00');
      end.setDate(end.getDate() + days);
      return end.getFullYear() + '-' +
        String(end.getMonth() + 1).padStart(2, '0') + '-' +
        String(end.getDate()).padStart(2, '0');
    }

    /* إرسال الطلب يُنشئ سجلاً حقيقياً في التخزين المحلي، فيظهر في لوحة الإدارة */
    function submitRequest(sum) {
      var latest = data.load();
      var name = els.renter ? els.renter.value.trim() : 'زائر الموقع';
      var phone = els.phone ? els.phone.value.trim() : '';
      var digits = data.normalizePhone(phone);
      var startDate = els.start ? els.start.value : '';
      var endDate = startDate ? addDays(startDate, DAYS_IN[sum.period] * sum.qty) : '';
      var now = new Date().toISOString();
      var value = Math.round(sum.total);

      var customer = digits && latest.customers.find(function (row) {
        return data.normalizePhone(row.contact) === digits;
      });

      if (!customer) {
        customer = {
          id: data.nextId('CU'), name: name, contact: phone, city: item.city,
          orders: 0, visits: 1, lastVisit: todayISO, activity: []
        };
        latest.customers.unshift(customer);
      }
      customer.orders = (Number(customer.orders) || 0) + 1;
      customer.lastVisit = todayISO;

      var order = {
        id: data.nextId('MH'),
        customerId: customer.id,
        ownerId: item.ownerId,
        equipmentId: item.id,
        renter: name,
        equipment: item.name,
        startDate: startDate,
        endDate: endDate,
        date: startDate,
        status: 'new',
        value: value,
        deliveryLocation: els.location ? els.location.value.trim() : '',
        source: 'public',
        createdAt: now,
        updatedAt: now,
        activity: [{ id: data.nextId('AC'), type: 'order_created', title: 'وصل طلب من الموقع', meta: item.name, at: now }],
        timeline: [{ id: data.nextId('TL'), stage: 'new', title: 'تم إنشاء الطلب', meta: 'من الموقع العام', at: now }],
        notes: [],
        documents: [],
        payment: { status: 'pending', total: value, paid: 0, due: value, transactions: [] }
      };
      latest.orders.unshift(order);

      latest.conversations.unshift({
        id: data.nextId('CV'),
        customerId: customer.id,
        ownerId: item.ownerId,
        orderId: order.id,
        equipment: item.name,
        unread: 1,
        updatedAt: now,
        messages: [{
          from: 'customer',
          text: 'طلب تأجير ' + item.name + ' لمدة ' + sum.qty + ' ' + UNIT_LABEL[sum.period] +
            (order.deliveryLocation ? ' — موقع التسليم: ' + order.deliveryLocation : ''),
          time: now
        }]
      });

      return { order: order, saved: data.save(latest) };
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (els.formError) els.formError.hidden = true;

      if (els.renter && !els.renter.value.trim()) {
        fail('اكتب اسم المنشأة أو الشخص المستأجر.', els.renter);
        return;
      }
      if (els.phone && data.normalizePhone(els.phone.value).length < 9) {
        fail('اكتب رقم جوال صحيح ليتواصل معك المالك.', els.phone);
        return;
      }
      if (els.start && !els.start.value) {
        if (els.dateError) {
          els.dateError.textContent = 'اختر تاريخ بدء التأجير.';
          els.dateError.hidden = false;
        }
        els.start.focus();
        return;
      }

      var result = submitRequest(totals());

      if (els.status) {
        els.status.hidden = false;
        els.status.textContent = result.saved
          ? 'وصل طلبك برقم ' + result.order.id + '. سيتواصل معك ' +
            (owner ? owner.name : 'المالك') + ' لتأكيد التوفّر والسعر النهائي.'
          : 'وصل طلبك. سيتواصل معك المالك لتأكيد التوفّر والسعر النهائي.';
        els.status.focus();
      }
      if (els.submit) els.submit.disabled = true;
    });

    recalc();
  }

  /* -------------------------------- التشغيل -------------------------------- */

  function init() {
    initTheme();
    initNav();
    initFaq();
    initCatalog();
    initFilter();
    initEquipmentPage();
    initTabs();
    initGallery();
    initCalculator();

    // سنة التذييل
    document.querySelectorAll('[data-year]').forEach(function (el) {
      el.textContent = new Date().getFullYear();
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

};

MOD["admin/admin-components.js"] = function (location, history, localStorage, sessionStorage) {
/* مِحور — مكونات واجهة الإدارة المشتركة */

(function () {
  'use strict';

  function escapeHTML(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function classNames() {
    return Array.prototype.slice.call(arguments).filter(Boolean).join(' ');
  }

  /* الروابط تأتي من بيانات يحرّرها المشغّل، فلا نسمح بمخطط قابل للتنفيذ
     مثل javascript: أن يصل إلى href أو src. */
  function safeUrl(value) {
    return (window.MihwarData ? window.MihwarData.safeUrl(value) : String(value || ''));
  }

  function StatusBadge(options) {
    var settings = options || {};
    return '<span class="' + escapeHTML(classNames('status-badge', 'owner-status', 'owner-status-' + (settings.tone || 'pending'), settings.className)) + '">' + escapeHTML(settings.label || 'غير محددة') + '</span>';
  }

  function EmptyState(options) {
    var settings = options || {};
    var action = settings.action;
    return '<div class="' + escapeHTML(classNames('entity-empty-state', 'crm-empty-state', settings.className)) + '">' +
      (settings.icon ? '<span class="empty-state-icon" aria-hidden="true">' + escapeHTML(settings.icon) + '</span>' : '') +
      '<strong>' + escapeHTML(settings.title || 'لا توجد بيانات') + '</strong>' +
      (settings.description ? '<p>' + escapeHTML(settings.description) + '</p>' : '') +
      (action && safeUrl(action.href) ? '<a class="' + escapeHTML(classNames('btn', action.variant || 'btn-ghost')) + '" href="' + escapeHTML(safeUrl(action.href)) + '">' + escapeHTML(action.label) + '</a>' : '') +
      '</div>';
  }

  function Timeline(options) {
    var settings = options || {};
    var items = Array.isArray(settings.items) ? settings.items : [];
    if (!items.length) {
      return EmptyState({
        title: settings.emptyTitle || 'لا يوجد نشاط مسجل',
        description: settings.emptyDescription || 'ستظهر هنا الأنشطة عند توفرها.',
        className: settings.emptyClassName
      });
    }
    return '<ol class="' + escapeHTML(classNames('entity-timeline', 'activity-timeline', settings.className)) + '">' + items.map(function (item) {
      return '<li><span class="activity-dot" aria-hidden="true"></span><div><strong>' + escapeHTML(item.title || 'نشاط') + '</strong>' +
        (item.meta ? '<span>' + escapeHTML(item.meta) + '</span>' : '') +
        (item.timeLabel ? '<small><bdi>' + escapeHTML(item.timeLabel) + '</bdi></small>' : '') +
        '</div></li>';
    }).join('') + '</ol>';
  }

  function Breadcrumb(options) {
    var settings = options || {};
    var items = Array.isArray(settings.items) ? settings.items : [];
    return '<nav class="' + escapeHTML(classNames('admin-breadcrumb', settings.className)) + '" aria-label="' + escapeHTML(settings.ariaLabel || 'مسار التنقل') + '">' + items.map(function (item, index) {
      var entry = item.href && !item.current
        ? '<a href="' + escapeHTML(item.href) + '">' + escapeHTML(item.label) + '</a>'
        : '<span' + (item.current ? ' aria-current="page"' : '') + '>' + escapeHTML(item.label) + '</span>';
      return (index ? '<span aria-hidden="true">/</span>' : '') + entry;
    }).join('') + '</nav>';
  }

  function EntityTabs(options) {
    var settings = options || {};
    var tabs = Array.isArray(settings.tabs) ? settings.tabs : [];
    return '<div class="' + escapeHTML(classNames('entity-tabs', 'owner-tabs', settings.className)) + '" role="tablist" aria-label="' + escapeHTML(settings.ariaLabel || 'أقسام الملف') + '">' + tabs.map(function (tab) {
      var selected = tab.id === settings.active;
      // tabindex متدحرج: التبويب المحدد وحده في مسار Tab، والبقية تُبلغ بالأسهم
      return '<button type="button" role="tab" aria-selected="' + String(selected) + '"' +
        ' tabindex="' + (selected ? '0' : '-1') + '"' +
        (settings.panelId ? ' aria-controls="' + escapeHTML(settings.panelId) + '"' : '') +
        ' data-entity-tab="' + escapeHTML(tab.id) + '">' + escapeHTML(tab.label) + '</button>';
    }).join('') + '</div>';
  }

  function QuickActions(options) {
    var settings = options || {};
    var actions = (Array.isArray(settings.actions) ? settings.actions : []).filter(function (action) { return !action.hidden; });
    return '<div class="' + escapeHTML(classNames(settings.className || 'owner-page-actions')) + '" aria-label="' + escapeHTML(settings.ariaLabel || 'الإجراءات السريعة') + '">' + actions.map(function (action) {
      var classes = classNames('btn', action.variant || 'btn-ghost', action.className, action.disabled && 'is-disabled');
      var common = ' class="' + escapeHTML(classes) + '" data-quick-action="' + escapeHTML(action.id) + '"' +
        (action.disabled ? ' aria-disabled="true"' : '') +
        (action.title ? ' title="' + escapeHTML(action.title) + '"' : '');
      if (safeUrl(action.href) && !action.disabled) {
        return '<a' + common + ' href="' + escapeHTML(safeUrl(action.href)) + '"' +
          (action.target ? ' target="' + escapeHTML(action.target) + '"' : '') +
          (action.rel ? ' rel="' + escapeHTML(action.rel) + '"' : '') + '>' + escapeHTML(action.label) + '</a>';
      }
      return '<button type="button"' + common + (action.disabled ? ' disabled' : '') + '>' + escapeHTML(action.label) + '</button>';
    }).join('') + '</div>';
  }

  function PageHeader(options) {
    var settings = options || {};
    var badges = Array.isArray(settings.badges) ? settings.badges.join('') : '';
    var meta = Array.isArray(settings.meta) ? settings.meta.filter(Boolean) : [];
    var titleTag = settings.titleTag === 'h2' ? 'h2' : 'h1';
    var mediaClasses = escapeHTML(classNames('entity-avatar', 'owner-avatar', 'owner-page-avatar', settings.avatarClassName));
    var media = safeUrl(settings.imageUrl)
      ? '<img class="' + mediaClasses + '" src="' + escapeHTML(safeUrl(settings.imageUrl)) + '" alt="' + escapeHTML(settings.imageAlt || settings.title || '') + '" loading="eager">'
      : '<span class="' + mediaClasses + '" aria-hidden="true">' + escapeHTML(settings.avatar || 'م') + '</span>';
    return '<header class="' + escapeHTML(classNames('entity-page-header', 'owner-page-header', settings.className)) + '">' +
      '<div class="entity-page-identity owner-page-identity">' +
        media +
        '<div><div class="owner-profile-title-line"><' + titleTag + '>' + escapeHTML(settings.title || 'ملف') + '</' + titleTag + '>' + badges + '</div>' +
        (meta.length ? '<p>' + meta.map(function (item) {
          if (item && typeof item === 'object') {
            return safeUrl(item.href)
              ? '<a class="entity-meta-link" href="' + escapeHTML(safeUrl(item.href)) + '">' + escapeHTML(item.label || '') + '</a>'
              : '<span>' + escapeHTML(item.label || '') + '</span>';
          }
          return '<span>' + escapeHTML(item) + '</span>';
        }).join('<span aria-hidden="true"> · </span>') + '</p>' : '') +
        (settings.supportingLabel || settings.supportingValue ? '<small>' + escapeHTML(settings.supportingLabel || '') + (settings.supportingLabel ? ': ' : '') + '<bdi>' + escapeHTML(settings.supportingValue || '—') + '</bdi></small>' : '') +
        '</div></div>' +
      QuickActions({ actions: settings.actions, className: settings.actionsClassName || 'owner-page-actions', ariaLabel: settings.actionsAriaLabel }) +
      '</header>';
  }

  /* تنقّل التبويبات بالنقر وبلوحة المفاتيح — الأسهم معكوسة لأن الواجهة RTL.
     يُربط مرة واحدة على الحاوية، فيبقى صالحاً بعد إعادة رسم التبويبات. */
  function bindEntityTabs(host, onSelect) {
    if (!host) return;

    function tabsIn() {
      return Array.prototype.slice.call(host.querySelectorAll('[data-entity-tab]'));
    }

    host.addEventListener('click', function (event) {
      var tab = event.target.closest('[data-entity-tab]');
      if (tab) onSelect(tab.dataset.entityTab);
    });

    host.addEventListener('keydown', function (event) {
      var tab = event.target.closest('[data-entity-tab]');
      if (!tab) return;
      var tabs = tabsIn();
      var index = tabs.indexOf(tab);
      var next = null;
      if (event.key === 'ArrowLeft') next = tabs[(index + 1) % tabs.length];
      else if (event.key === 'ArrowRight') next = tabs[(index - 1 + tabs.length) % tabs.length];
      else if (event.key === 'Home') next = tabs[0];
      else if (event.key === 'End') next = tabs[tabs.length - 1];
      if (!next) return;
      event.preventDefault();
      var id = next.dataset.entityTab;
      onSelect(id);
      var focusTarget = host.querySelector('[data-entity-tab="' + id.replace(/"/g, '\\"') + '"]');
      if (focusTarget) focusTarget.focus();
    });
  }

  window.MihwarComponents = {
    PageHeader: PageHeader,
    bindEntityTabs: bindEntityTabs,
    Breadcrumb: Breadcrumb,
    EntityTabs: EntityTabs,
    Timeline: Timeline,
    StatusBadge: StatusBadge,
    QuickActions: QuickActions,
    EmptyState: EmptyState
  };
})();
