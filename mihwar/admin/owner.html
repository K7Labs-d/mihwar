<!doctype html>
<html lang="ar" dir="rtl" class="auth-pending">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ملف المالك — مِحور</title>
  <meta name="description" content="ملف مالك المعدات التشغيلي في لوحة إدارة مِحور.">

  <style>.auth-pending body { visibility: hidden; }</style>
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('mihwar-theme');
        if (saved === 'dark' || saved === 'light') document.documentElement.setAttribute('data-theme', saved);
        var auth = JSON.parse(localStorage.getItem('mihwar-admin-auth'));
        var fresh = auth && auth.loggedIn === true && (Date.now() - (auth.at || 0)) < 43200000;
        if (!fresh) {
          location.replace('login.html');
          return;
        }
        document.documentElement.classList.remove('auth-pending');
      } catch (e) {
        location.replace('login.html');
      }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Tajawal:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/styles.css">
  <link rel="stylesheet" href="admin.css?v=data-1">
  <script src="../assets/data.js" defer></script>
  <script src="../assets/app.js" defer></script>
  <script src="admin-components.js?v=data-1" defer></script>
  <script src="admin.js?v=data-1" defer></script>
  <script src="owner.js?v=data-1" defer></script>
</head>
<body class="admin-page owner-page">
  <a class="skip-link" href="#owner-main">تخطَّ إلى ملف المالك</a>

  <div class="admin-shell">
    <aside class="admin-sidebar">
      <a class="brand admin-brand" href="../index.html" aria-label="العودة إلى موقع مِحور">
        <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M24 3 41.3 13v20L24 43 6.7 33V13z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
          <circle cx="24" cy="23" r="7" fill="none" stroke="var(--primary)" stroke-width="3"/>
          <circle cx="24" cy="23" r="1.8" fill="var(--primary)"/>
        </svg>
        <span>مِحور<small>لوحة الإدارة</small></span>
      </a>

      <nav class="admin-nav" aria-label="أقسام لوحة الإدارة">
        <a href="index.html#summary"><span aria-hidden="true">🏠</span> الرئيسية</a>
        <a href="index.html#orders"><span aria-hidden="true">📦</span> الطلبات</a>
        <a href="index.html#equipment"><span aria-hidden="true">🚜</span> المعدات</a>
        <a href="index.html#owners" aria-current="page"><span aria-hidden="true">👤</span> الملاك</a>
        <a href="index.html#customers"><span aria-hidden="true">👥</span> العملاء</a>
        <a href="index.html#settings"><span aria-hidden="true">⚙️</span> الإعدادات</a>
      </nav>

      <div class="sidebar-actions">
        <button class="icon-btn" type="button" data-theme-toggle aria-label="التبديل إلى الوضع الليلي">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button class="btn btn-ghost admin-logout" type="button" data-owner-logout>تسجيل الخروج</button>
      </div>
    </aside>

    <main class="admin-main owner-main" id="owner-main">
      <div data-owner-breadcrumb></div>

      <section class="owner-not-found" data-owner-not-found hidden>
        <span aria-hidden="true">!</span>
        <h1>تعذّر العثور على المالك</h1>
        <p>قد يكون الرابط غير مكتمل أو أن السجل لم يعد موجودًا على هذا الجهاز.</p>
        <a class="btn btn-primary" href="index.html#owners">العودة إلى قائمة الملاك</a>
      </section>

      <article class="owner-page-content" data-owner-content hidden>
        <div data-owner-page-header></div>
        <div data-owner-page-tabs></div>

        <section class="owner-tab-panel owner-page-panel" id="owner-tab-panel" role="tabpanel" tabindex="0" data-owner-page-panel></section>
      </article>
    </main>
  </div>

  <dialog class="equipment-dialog" data-owner-page-edit-dialog aria-labelledby="owner-page-edit-title">
    <form method="dialog" class="dialog-card" data-owner-page-edit-form>
      <div class="dialog-heading">
        <div>
          <span class="eyebrow">بيانات المالك</span>
          <h2 id="owner-page-edit-title">تعديل ملف المالك</h2>
        </div>
        <button class="dialog-close" type="button" data-close-owner-page-edit aria-label="إغلاق">×</button>
      </div>
      <div class="dialog-grid">
        <div class="admin-field dialog-wide"><label for="owner-page-edit-name">الاسم</label><input id="owner-page-edit-name" name="name" type="text" required></div>
        <div class="admin-field"><label for="owner-page-edit-contact">رقم التواصل</label><input id="owner-page-edit-contact" name="contact" type="tel" inputmode="tel"></div>
        <div class="admin-field"><label for="owner-page-edit-city">المدينة</label><input id="owner-page-edit-city" name="city" type="text" required></div>
        <div class="admin-field dialog-wide"><label for="owner-page-edit-verification">حالة التحقق</label><select id="owner-page-edit-verification" name="verification" required><option value="verified">موثق</option><option value="pending">بانتظار التحقق</option><option value="rejected">مرفوض</option></select></div>
      </div>
      <div class="dialog-actions">
        <button class="btn btn-ghost" type="button" data-close-owner-page-edit>إلغاء</button>
        <button class="btn btn-primary" type="submit">حفظ التعديلات</button>
      </div>
    </form>
  </dialog>

  <div class="admin-toast" data-owner-toast role="status" aria-live="polite" hidden></div>
</body>
</html>
