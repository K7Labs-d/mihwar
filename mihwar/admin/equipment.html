<!doctype html>
<html lang="ar" dir="rtl" class="auth-pending">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ملف المعدة — مِحور</title>
  <meta name="description" content="ملف المعدة التشغيلي في لوحة إدارة مِحور.">

  <style>.auth-pending body { visibility: hidden; }</style>
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('mihwar-theme');
        if (saved === 'dark' || saved === 'light') document.documentElement.setAttribute('data-theme', saved);
        var auth = JSON.parse(sessionStorage.getItem('mihwar-admin-auth'));
        if (!auth || auth.loggedIn !== true) {
          location.replace('login.html');
          return;
        }
        document.documentElement.classList.remove('auth-pending');
      } catch (e) {
        location.replace('login.html');
      }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Tajawal:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/styles.css">
  <link rel="stylesheet" href="admin.css?v=order-1">
  <script src="../assets/app.js" defer></script>
  <script src="admin-components.js?v=order-1" defer></script>
  <script src="admin.js?v=order-1" defer></script>
  <script src="equipment.js?v=order-1" defer></script>
</head>
<body class="admin-page equipment-page">
  <a class="skip-link" href="#equipment-main">تخطَّ إلى ملف المعدة</a>

  <div class="admin-shell">
    <aside class="admin-sidebar">
      <a class="brand admin-brand" href="../index.html" aria-label="العودة إلى موقع مِحور">
        <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M24 3 41.3 13v20L24 43 6.7 33V13z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
          <circle cx="24" cy="23" r="7" fill="none" stroke="var(--primary)" stroke-width="3"/>
          <circle cx="24" cy="23" r="1.8" fill="var(--primary)"/>
        </svg>
        <span>مِحور<small>لوحة الإدارة</small></span>
      </a>

      <nav class="admin-nav" aria-label="أقسام لوحة الإدارة">
        <a href="index.html#summary"><span aria-hidden="true">🏠</span> الرئيسية</a>
        <a href="index.html#orders"><span aria-hidden="true">📦</span> الطلبات</a>
        <a href="index.html#equipment" aria-current="page"><span aria-hidden="true">🚜</span> المعدات</a>
        <a href="index.html#owners"><span aria-hidden="true">👤</span> الملاك</a>
        <a href="index.html#customers"><span aria-hidden="true">👥</span> العملاء</a>
        <a href="index.html#settings"><span aria-hidden="true">⚙️</span> الإعدادات</a>
      </nav>

      <div class="sidebar-actions">
        <button class="icon-btn" type="button" data-theme-toggle aria-label="التبديل إلى الوضع الليلي">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button class="btn btn-ghost admin-logout" type="button" data-equipment-logout>تسجيل الخروج</button>
      </div>
    </aside>

    <main class="admin-main owner-main" id="equipment-main">
      <div data-equipment-breadcrumb></div>

      <section class="owner-not-found" data-equipment-not-found hidden>
        <span aria-hidden="true">!</span>
        <h1>تعذّر العثور على المعدة</h1>
        <p>قد يكون الرابط غير مكتمل أو أن سجل المعدة لم يعد موجودًا على هذا الجهاز.</p>
        <a class="btn btn-primary" href="index.html#equipment">العودة إلى قائمة المعدات</a>
      </section>

      <article class="owner-page-content" data-equipment-content hidden>
        <div data-equipment-page-header></div>
        <div data-equipment-page-tabs></div>
        <section class="owner-tab-panel owner-page-panel" id="equipment-tab-panel" role="tabpanel" tabindex="0" data-equipment-page-panel></section>
      </article>
    </main>
  </div>

  <dialog class="equipment-dialog" data-equipment-page-edit-dialog aria-labelledby="equipment-page-edit-title">
    <form method="dialog" class="dialog-card" data-equipment-page-edit-form>
      <div class="dialog-heading">
        <div><span class="eyebrow">بيانات المعدة</span><h2 id="equipment-page-edit-title">تعديل ملف المعدة</h2></div>
        <button class="dialog-close" type="button" data-close-equipment-edit aria-label="إغلاق">×</button>
      </div>
      <div class="dialog-grid">
        <div class="admin-field dialog-wide"><label for="equipment-page-name">اسم المعدة</label><input id="equipment-page-name" name="name" type="text" required></div>
        <div class="admin-field"><label for="equipment-page-category">الفئة</label><input id="equipment-page-category" name="category" type="text"></div>
        <div class="admin-field"><label for="equipment-page-city">المدينة</label><input id="equipment-page-city" name="city" type="text"></div>
        <div class="admin-field"><label for="equipment-page-rate">السعر اليومي (ر.س)</label><input id="equipment-page-rate" name="dailyRate" type="number" min="0" step="1" inputmode="numeric"></div>
        <div class="admin-field"><label for="equipment-page-owner">المالك</label><select id="equipment-page-owner" name="ownerId"></select></div>
        <div class="admin-field dialog-wide"><label for="equipment-page-note">ملاحظة تشغيلية مختصرة</label><textarea id="equipment-page-note" name="operationalNote" rows="3"></textarea></div>
      </div>
      <div class="dialog-actions">
        <button class="btn btn-ghost" type="button" data-close-equipment-edit>إلغاء</button>
        <button class="btn btn-primary" type="submit">حفظ التعديلات</button>
      </div>
    </form>
  </dialog>

  <dialog class="equipment-dialog" data-equipment-status-dialog aria-labelledby="equipment-status-title">
    <form method="dialog" class="dialog-card" data-equipment-status-form>
      <div class="dialog-heading">
        <div><span class="eyebrow">الحالة التشغيلية</span><h2 id="equipment-status-title">تغيير حالة المعدة</h2></div>
        <button class="dialog-close" type="button" data-close-equipment-status aria-label="إغلاق">×</button>
      </div>
      <div class="admin-field">
        <label for="equipment-page-status">الحالة</label>
        <select id="equipment-page-status" name="status" required>
          <option value="active">معروضة</option>
          <option value="pending_review">بانتظار المراجعة</option>
          <option value="booked">محجوزة</option>
          <option value="unavailable">غير متاحة</option>
          <option value="paused">موقوفة</option>
        </select>
      </div>
      <div class="dialog-actions">
        <button class="btn btn-ghost" type="button" data-close-equipment-status>إلغاء</button>
        <button class="btn btn-primary" type="submit">حفظ الحالة</button>
      </div>
    </form>
  </dialog>

  <div class="admin-toast" data-equipment-toast role="status" aria-live="polite" hidden></div>
</body>
</html>
